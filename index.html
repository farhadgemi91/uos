<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1e3a8a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ئامادەبوون">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<script src="config.js"></script>
<script>if('serviceWorker' in navigator&&location.protocol!=='file:'){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سیستەمی ئامادەبوون — زانکۆی سلێمانی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5f9;--card:#fff;--ink:#14213a;--muted:#64748b;--line:#e2e8f0;--pri:#1d4e89;--pri2:#2563eb;--soft:#e8f0fb;
--ok:#15803d;--okbg:#e5f6ec;--bad:#dc2626;--badbg:#fde8e8;--warn:#c2410c;--warnbg:#fff1e0;--late:#b45309;--latebg:#fef3c7;--exc:#1d4ed8;--excbg:#dbeafe;--vio:#6d28d9;--viobg:#efe9fd}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans Arabic',Tahoma,'Segoe UI',sans-serif;font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
body{padding-bottom:calc(78px + env(safe-area-inset-bottom))}
body.nologin{padding-bottom:0}
button{font:inherit;cursor:pointer}input,select,textarea{font:inherit;color:inherit}
header.top{background:linear-gradient(135deg,#0d2546,#1d4e89 60%,#2366a8);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 12px;box-shadow:0 4px 18px rgba(13,37,70,.25)}
.top-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.15);display:grid;place-items:center;flex:none;font-weight:800;font-size:13px;letter-spacing:.5px}
.hname{min-width:0;flex:1}.hname b{display:block;font-size:14.5px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hname small{opacity:.8;font-size:12px}
.hb{position:relative;width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.13);color:#fff;display:grid;place-items:center;padding:0;flex:none}
.hb svg{width:21px;height:21px}.hb .cnt{position:absolute;top:-5px;left:-5px;min-width:18px;height:18px;border-radius:9px;background:#f87171;color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 4px}.hb .cnt:empty{display:none}
.net{display:flex;align-items:center;gap:6px;border:0;border-radius:99px;padding:7px 11px;font-size:12px;font-weight:700;white-space:nowrap;flex:none}
.net.on{background:#dcfce7;color:#166534}.net.off{background:#fee2e2;color:#991b1b}
.net i{width:9px;height:9px;border-radius:50%;background:currentColor}
main{max-width:1100px;margin:0 auto;padding:14px}
nav.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-top:1px solid var(--line);z-index:40;padding:5px 4px calc(5px + env(safe-area-inset-bottom))}
nav.bottom .nin{max-width:680px;margin:0 auto;display:flex}
nav.bottom button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:var(--muted);padding:6px 0;border-radius:12px;position:relative}
nav.bottom button svg{width:23px;height:23px}
nav.bottom button.on{color:var(--pri);font-weight:700}nav.bottom button.on svg{background:var(--soft);border-radius:9px;padding:2px;width:34px}
nav.bottom .dot{position:absolute;top:2px;left:50%;margin-left:6px;min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(16,24,40,.04)}
.card h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px;font-weight:700;flex-wrap:wrap}
.card h2 .sp{margin-inline-start:auto}
.muted{color:var(--muted);font-size:13px}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:#eef2f7;color:var(--ink);font-size:14px;line-height:1.3}
.btn.pri{background:var(--pri);color:#fff}.btn.ok{background:var(--ok);color:#fff}.btn.danger{background:var(--badbg);color:var(--bad)}.btn.outline{background:#fff;border:1.5px solid var(--line)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}.btn.block{width:100%}.btn.xl{background:#107c41;color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grow{flex:1;min-width:0}
.inp{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;outline:none}
.inp:focus{border-color:var(--pri2);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
textarea.inp{min-height:110px;resize:vertical}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}.field label{font-size:13px;color:var(--muted);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}@media(min-width:720px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;position:relative;overflow:hidden}
.stat b{font-size:24px;display:block;font-weight:800;line-height:1.2}.stat span{color:var(--muted);font-size:12.5px}
.stat::after{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--c,var(--pri))}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 13px;font-size:13px;font-weight:600;color:#334155;flex:none}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.b-ok{background:var(--okbg);color:var(--ok)}.b-warn{background:var(--warnbg);color:var(--warn)}.b-bad{background:var(--badbg);color:var(--bad)}.b-n{background:#eef2f7;color:#475569}.b-pri{background:var(--soft);color:var(--pri)}.b-vio{background:var(--viobg);color:var(--vio)}.b-late{background:var(--latebg);color:var(--late)}.b-exc{background:var(--excbg);color:var(--exc)}
.list .it{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}.list .it:last-child{border:0}
.slist{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.num{width:32px;height:32px;border-radius:10px;background:#eef2f7;display:grid;place-items:center;font-weight:700;font-size:13px;color:#334155;flex:none}
.ibtn{border:0;background:#f1f5f9;border-radius:9px;width:34px;height:34px;display:grid;place-items:center;color:#475569;flex:none}
.ibtn svg{width:17px;height:17px}.ibtn.red{color:var(--bad);background:var(--badbg)}
.empty{text-align:center;padding:26px 16px;color:var(--muted)}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:flex-end;justify-content:center;z-index:100;animation:fd .15s}
.dlg{background:#fff;width:100%;max-width:580px;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom));animation:up .2s}
.dlg h3{margin:0 0 12px;font-size:17px}.dlg .acts{display:flex;gap:8px;margin-top:14px;position:sticky;bottom:0;background:#fff;padding-top:8px}.dlg .acts .btn{flex:1}
@media(min-width:640px){.ov{align-items:center}.dlg{border-radius:22px}}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}@keyframes fd{from{opacity:0}to{opacity:1}}
#toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.tst{background:#14213a;color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:up .2s;max-width:90vw}.tst.err{background:#b91c1c}.tst.ok{background:#15803d}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff;max-height:70vh}
table.gt{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:13.5px}
.gt th{position:sticky;top:0;background:#1d4e89;color:#fff;font-size:12.5px;padding:8px 6px;z-index:2;white-space:nowrap;font-weight:700}
.gt th small{display:block;opacity:.8;font-weight:400;font-size:11px}
.gt td{border-bottom:1px solid var(--line);padding:5px;text-align:center;background:#fff;white-space:nowrap}
.gt tr:nth-child(even) td{background:#fafbfd}
.gt td+td{border-inline-start:1px solid #dbe4f0}.gt th+th{border-inline-start:1px solid rgba(255,255,255,.22)}
#gt tbody td:nth-child(even):not(.c-n):not(.c-nm){background:#f1f6fd}
#gt tbody tr:nth-child(even) td:nth-child(even):not(.c-n):not(.c-nm){background:#e8f0fb}
#gt thead th:nth-child(even):not(.c-n):not(.c-nm):not(.colon):not(.attcol){background:#2a5f9e}
#gt tbody tr:focus-within td{background:#fff8e1!important}
.gt .c-n{position:sticky;right:0;z-index:1;width:40px;min-width:40px;font-weight:700;color:#475569}
.gt .c-nm{position:sticky;right:40px;z-index:1;min-width:150px;text-align:right;font-weight:600;box-shadow:-1px 0 0 var(--line)}
.gt th.c-n,.gt th.c-nm{z-index:3;background:#173f70}
.gi{width:58px;text-align:center;padding:7px 3px;border:1.5px solid var(--line);border-radius:9px;direction:ltr;background:#fff;outline:none;font-weight:600}
.gi.bad{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.st{display:inline-grid;place-items:center;min-width:28px;height:26px;border-radius:8px;font-weight:800;font-size:12px}
.st.P{background:var(--okbg);color:var(--ok)}.st.A{background:var(--badbg);color:var(--bad)}.st.T{background:var(--latebg);color:var(--late)}.st.E{background:var(--excbg);color:var(--exc)}.st.L{background:var(--viobg);color:var(--vio)}.st.N{background:#f1f5f9;color:#94a3b8}
/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#0d2546,#1d4e89 55%,#2f7bbf)}
.lbox{background:#fff;border-radius:22px;padding:26px 20px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.lbox .lg{width:64px;height:64px;border-radius:18px;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:800;margin:0 auto 10px;font-size:17px}
.lbox h1{text-align:center;font-size:19px;margin:0}.lbox p.c{text-align:center;color:var(--muted);margin:2px 0 18px;font-size:13.5px}
.demo{margin-top:16px;border-top:1px dashed var(--line);padding-top:12px}
.demo button{display:flex;width:100%;align-items:center;gap:10px;border:1px solid var(--line);background:#fafbfd;border-radius:12px;padding:8px 10px;margin-bottom:6px;text-align:right}
.demo button b{font-size:13.5px}.demo button span{margin-inline-start:auto;font-size:12px;color:var(--muted);direction:ltr}
/* attendance rows */
.arow{display:grid;grid-template-columns:32px 1fr auto;gap:6px 10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.arow:last-child{border-bottom:0}
.arow .nm{font-weight:600;font-size:14.5px;line-height:1.4;word-break:break-word}
.arow .sub{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:2px}
.actl{display:flex;align-items:center;gap:8px}
.tg{position:relative;width:54px;height:32px;border-radius:16px;border:0;padding:0;background:#e5e9f0;box-shadow:inset 0 0 0 1px #d5dbe5;transition:background .2s;flex:none}
.tg::after{content:"";position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:right .2s}
.tg.on{background:#22c55e;box-shadow:none}.tg.on::after{right:25px}
.tg.none{background:#fff;box-shadow:inset 0 0 0 1.5px #c3ccd8;outline:1.5px dashed #c3ccd8;outline-offset:-1.5px}.tg.none::after{opacity:.35}
.opts{grid-column:1/-1;display:none;gap:6px}
.arow.off .opts{display:flex}
.opt{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:7px 4px;font-size:13px;font-weight:700;color:#64748b}
.opt[data-s=A].on{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[data-s=T].on{background:#f59e0b;border-color:#f59e0b;color:#fff}
.opt[data-s=E].on{background:var(--exc);border-color:var(--exc);color:#fff}
.opt.clr{flex:none;color:#64748b;border-style:dashed;padding:7px 9px}
.opt.official{background:var(--viobg)!important;border-color:var(--vio)!important;color:var(--vio)!important}
.nbtn{border:0;background:#f1f5f9;border-radius:9px;width:34px;height:34px;display:grid;place-items:center;color:#94a3b8;flex:none}
.nbtn.has{background:#fef3c7;color:#b45309}
.nbtn svg{width:17px;height:17px}
@media(min-width:760px){.arow{grid-template-columns:36px 1fr auto auto}.opts{grid-column:auto}.arow.off .opts{display:flex}.opt{flex:none;padding:7px 12px}}
.counters{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0 4px}
.counters div{border-radius:12px;padding:7px 4px;text-align:center;font-size:11px;font-weight:600}.counters b{display:block;font-size:18px;line-height:1.2}
.cP{background:var(--okbg);color:var(--ok)}.cA{background:var(--badbg);color:var(--bad)}.cT{background:var(--latebg);color:var(--late)}.cE{background:var(--excbg);color:var(--exc)}.cN{background:#eef2f7;color:#475569}
.lec{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff;margin-bottom:8px;cursor:pointer}
.lec .tm{min-width:62px;text-align:center;background:var(--soft);color:var(--pri);border-radius:11px;padding:6px 4px;font-weight:800;line-height:1.2;font-size:14px;direction:ltr}
.lec .tm small{display:block;font-size:10.5px;font-weight:600}
.lec .tm.tm-due{background:#fee2e2;color:#b91c1c;box-shadow:inset 0 0 0 2px #f87171}
.lec.lc-up{background:#eff6ff;border-color:#bfdbfe}.lec.lc-due{background:#fef2f2;border-color:#fca5a5}.lec.lc-ok{background:#f0fdf4;border-color:#86efac}.lec.lc-x{background:#f8fafc}
.badge.b-up{background:#dbeafe;color:#1d4ed8}.lec .tm.tm-ok{background:#dcfce7;color:#15803d;box-shadow:inset 0 0 0 2px #4ade80}.lec .tm.tm-x{background:#f1f5f9;color:#94a3b8}
.banner{border-radius:14px;padding:11px 13px;margin-bottom:12px;font-size:13.5px;display:flex;gap:10px;align-items:center}
.banner.off{background:#fee2e2;color:#991b1b}.banner.info{background:var(--soft);color:var(--pri)}.banner.warn{background:var(--warnbg);color:var(--warn)}.banner.ok{background:var(--okbg);color:var(--ok)}
.notif{padding:11px 12px;border-bottom:1px solid var(--line);display:flex;gap:10px}.notif:last-child{border:0}.notif.unread{background:#f6f9ff}
.notif .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--soft);color:var(--pri)}.notif .ic svg{width:19px;height:19px}
.sumline{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--soft);border-radius:12px;font-weight:700;color:var(--pri);margin:6px 0}
.catrow{display:grid;grid-template-columns:1fr 72px 34px 34px;gap:6px;align-items:center;margin-bottom:8px}
.search{position:relative}.search input{padding-inline-start:36px}.search svg{position:absolute;right:11px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:#94a3b8}
.priv{background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:9px 11px;font-size:12.5px;color:#92400e;margin-bottom:8px}
.offnote{background:var(--viobg);border:1px solid #ddd0fb;border-radius:12px;padding:10px 12px;color:#4c1d95;margin-bottom:10px}
.loading{position:fixed;inset:0;background:var(--bg);z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--muted)}
.spin{width:38px;height:38px;border:4px solid #dbe4f0;border-top-color:var(--pri);border-radius:50%;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.tabs2{display:flex;background:#e6ebf2;border-radius:13px;padding:4px;margin-bottom:10px;gap:4px}.tabs2 button{flex:1;border:0;background:none;border-radius:10px;padding:9px 4px;font-weight:700;font-size:13.5px;color:#475569}.tabs2 button.on{background:#fff;color:var(--pri);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}.calhead b{font-size:15px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:10.5px;color:var(--muted);text-align:center;font-weight:700;padding-bottom:2px}
.cal .d{position:relative;border:0;border-radius:11px;background:#f8fafc;font-weight:700;font-size:14px;height:42px;color:#334155;padding:0}
.cal .d i{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);min-width:7px;height:7px;border-radius:4px;background:var(--pri2);font-style:normal;font-size:0}
.cal .d.has{background:#eef4ff}
.cal .d.done i{background:#16a34a}.cal .d.miss i{background:#f59e0b}.cal .d.miss{background:#fff7e6}
.cal .d.hol{background:#fde8e8;color:#b91c1c}
.cal .d.today{box-shadow:inset 0 0 0 2px var(--pri)}
.cal .d.sel{background:var(--pri);color:#fff}.cal .d.sel i{background:#fff}
.calleg{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:11.5px;color:var(--muted)}.calleg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:4px;vertical-align:middle}
.dayhead{font-weight:800;font-size:15px;margin:4px 4px 10px}
.banner.hol{background:#fde8e8;color:#991b1b}
.lec.holl{opacity:.7;cursor:default;background:#fff7f7}
body.kb{padding-bottom:65vh}
body.kb nav.bottom{display:none}
body.kb .ov{align-items:flex-start}
body.kb .dlg{max-height:50vh;border-radius:0 0 22px 22px;padding-bottom:12px;animation:none}
body.kb #toast{bottom:auto;top:12px}
.gt th.colon{background:#f59e0b!important;color:#fff}
.gi.colon{border-color:#fbbf24;background:#fffbeb}
.gi.colon:focus{border-color:#2563eb;background:#fff}
.dlg .acts{flex-wrap:wrap}.dlg .acts .btn{flex:1 1 30%}
.auto{display:inline-block;min-width:50px;padding:6px 8px;border-radius:9px;background:var(--soft);color:var(--pri);font-weight:800}
.gt th.attcol{background:#0e7490}
.catrow .att{grid-column:1/2;font-size:11.5px;color:#0e7490;font-weight:700;margin-top:-4px}
.sumline.bad{background:var(--badbg);color:var(--bad)}
.switch{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0;font-size:14px}.switch input[type=checkbox]{width:20px;height:20px;accent-color:var(--pri)}
.sep{height:1px;background:var(--line);margin:8px 0}
.fsheet{position:fixed;inset:0;z-index:150;background:#3f4a5a;display:flex;flex-direction:column;animation:fd .15s}
.fbar{background:#1b2230;padding:calc(10px + env(safe-area-inset-top)) 10px 8px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.fbtns{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}

/* ---- shared: document diff / apply (used by server and app) ---- */
function uosIsObj(x){return x!==null&&typeof x==='object'&&!Array.isArray(x);}
function uosIsIdArr(a){if(!Array.isArray(a))return false;for(var i=0;i<a.length;i++){if(!uosIsObj(a[i])||typeof a[i].id!=='string')return false;}return true;}
function uosDiff(a,b,p,out){
  out=out||[];p=p||[];
  if(a===b)return out;
  if(uosIsObj(a)&&uosIsObj(b)){
    var k;for(k in b){if(!Object.prototype.hasOwnProperty.call(b,k))continue;if(!Object.prototype.hasOwnProperty.call(a,k)){if(b[k]!==undefined)out.push({p:p.concat([k]),v:b[k]});}else uosDiff(a[k],b[k],p.concat([k]),out);}

    return out;}
  if(Array.isArray(a)&&Array.isArray(b)&&(a.length||b.length)&&uosIsIdArr(a)&&uosIsIdArr(b)){
    var ia={},ib={},i;for(i=0;i<a.length;i++)ia[a[i].id]=a[i];for(i=0;i<b.length;i++)ib[b[i].id]=b[i];

    var front=[];
    for(i=0;i<b.length;i++){var e=b[i];
      if(!ia[e.id]){if(a.length&&i<firstOld)front.push({p:p.concat(['#'+e.id]),v:e,pos:'f'});else out.push({p:p.concat(['#'+e.id]),v:e,pos:'e'});}

    for(i=front.length-1;i>=0;i--)out.push(front[i]);
    for(i=0;i<a.length;i++){if(!ib[a[i].id])out.push({p:p.concat(['#'+a[i].id]),d:1});}

  open(){if(this.db!==undefined)return Promise.resolve(this.db);return new Promise(res=>{try{const r=indexedDB.open('uos_live',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>{this.db=null;res(null)};}catch(e){this.db=null;res(null)}});},
  async get(k){const db=await this.open();if(!db){const v=lsGet(':'+k);return v?JSON.parse(v):undefined;}return new Promise(res=>{try{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(undefined);}catch(e){res(undefined)}});},
  async setMany(obj){const db=await this.open();if(!db){Object.entries(obj).forEach(([k,v])=>lsSet(':'+k,v===undefined?null:JSON.stringify(v)));return;}
    return new Promise(res=>{try{const tx=db.transaction('kv','readwrite');const st=tx.objectStore('kv');Object.entries(obj).forEach(([k,v])=>{if(v===undefined)st.delete(k);else st.put(v,k);});tx.oncomplete=()=>res();tx.onerror=()=>res();}catch(e){res()}});},
  async clear(){const db=await this.open();if(!db){try{Object.keys(localStorage).filter(k=>k.startsWith(LS+':')).forEach(k=>localStorage.removeItem(k))}catch(e){}return;}
    return new Promise(res=>{try{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').clear();tx.oncomplete=()=>res();tx.onerror=()=>res();}catch(e){res()}});}
};

/* ---- transport: google.script.run inside the Google page, fetch elsewhere ---- */
function api(req,ms=60000){
  return new Promise((res,rej)=>{let done=false;const to=setTimeout(()=>{if(!done){done=true;rej(new Error('timeout'))}},ms);
    const ok=v=>{if(done)return;done=true;clearTimeout(to);res(v)},bad=e=>{if(done)return;done=true;clearTimeout(to);rej(e)};
    if(IN_GAS()){google.script.run.withSuccessHandler(s=>{try{ok(JSON.parse(s))}catch(e){bad(e)}}).withFailureHandler(bad).api(JSON.stringify(req));return;}
    if(!SRV){bad(new Error('noserver'));return;}
    fetch(SRV,{method:'POST',body:JSON.stringify(req),headers:{'Content-Type':'text/plain;charset=utf-8'},redirect:'follow'}).then(r=>r.json()).then(ok,bad);});

/* ---- sync: send local changes, receive what others changed ---- */
function syncNow(){
  if(!TOKEN)return Promise.resolve(null);
  if(NET.busy){NET.again=true;return NET.busy;}
  NET.busy=(async()=>{
    clearTimeout(NET.push);clearTimeout(NET.retry);NET.state='busy';updateNetSoon();
    const sent={},ops={},age={},now=Date.now();let pc=0;
    Object.keys(DIRTY).forEach(k=>{const o=uosDiff(B[k]===undefined?null:B[k],S[k]===undefined?null:S[k]);if(o.length){ops[k]=o;age[k]=now-DIRTY[k];sent[k]=clone(S[k]);pc+=o.length;}else{delete DIRTY[k];saveKey(k);}});
    let res;
    try{res=await api({a:'sync',t:TOKEN,ops,age,have:Object.assign({},VER),pc,dev:(navigator.userAgent||'').replace(/^Mozilla\/5\.0 \(/,'').slice(0,60)});}
    catch(e){NET.state='off';NET.err=String(e&&e.message||e);NET.pc=pc;NET.retry=setTimeout(()=>syncNow(),30000);updateNetSoon();return {ok:false,off:true};}
    if(!res||!res.ok){NET.state='err';NET.err=res&&res.err||'';updateNetSoon();
      if(res&&res.err==='auth'){sessionEnded();}else NET.retry=setTimeout(()=>syncNow(),60000);return res;}
    let visible=false;
    (res.denied||[]).forEach(k=>{if(B[k]!==undefined)S[k]=clone(B[k]);else delete S[k];delete DIRTY[k];delete sent[k];saveKey(k);});
    const keys=new Set([...Object.keys(sent),...Object.keys(res.docs||{})]);
    keys.forEach(k=>{const r=(res.docs||{})[k];const base=r?r.d:B[k];const pre=sent[k]!==undefined?sent[k]:B[k];
      const delta=uosDiff(pre===undefined?null:pre,S[k]===undefined?null:S[k]);const before=JSON.stringify(S[k]);
      let nd=clone(base);delta.forEach(op=>{nd=uosApply(nd,op)});
      if(r){B[k]=r.d;VER[k]=r.v;}
      if(nd===undefined||nd===null){if(r)S[k]=clone(r.d);}else S[k]=nd;
      if(delta.length){if(!DIRTY[k])DIRTY[k]=Date.now();}else delete DIRTY[k];
      if(JSON.stringify(S[k])!==before)visible=true;saveKey(k);});
    (res.gone||[]).forEach(k=>{delete S[k];delete B[k];delete VER[k];delete DIRTY[k];saveKey(k);visible=true;});
    Object.keys(S).filter(k=>k.startsWith('dev_')).forEach(k=>delete S[k]);
    Object.entries(res.dev||{}).forEach(([uid,d])=>{S['dev_'+uid]=Object.assign({online:true,pend:{}},d);});
    saveKey('__meta');
    NET.lastOk=Date.now();lsSet('_ok',String(NET.lastOk));NET.pc=pendingCount();NET.state=NET.pc?'pend':'ok';NET.err='';
    if(S.core&&MYID){const u=user(MYID);if(!u||u.active===false){sessionEnded('inactive');return res;}if(ME&&u!==ME)ME=u;}
    updateNetSoon();if(visible)softRender();
    return res;
  })().finally(()=>{const again=NET.again;NET.busy=false;NET.again=false;if(again||Object.keys(DIRTY).length&&NET.state==='pend')setTimeout(()=>syncNow(),again?50:3000);});
  return NET.busy;
}

function lecturesOf(sid,from,to){ // [{course,slot,date}]
  const st=C().students.find(s=>s.id===sid);if(!st)return[];const out=[];
  for(let d=from;d<=to;d=addDays(d,1)){if(holidayOn(d))continue;const wd=wdOf(d);C().slots.filter(sl=>sl.weekday===wd).forEach(sl=>{const c=course(sl.courseId);if(c&&c.stage===st.stage&&secFits(c,st))out.push({c,sl,date:d});});if(out.length>200)break;}

/* ================= Absence alerts (per course, teacher settings) ================= */
function alertCfg(c){const g=GR(c.id);return Object.assign({daysOn:true,days:3,pctOn:true,pct:10,minRec:2,weeks:14},g.alert||{});}
function perWeek(c){return Math.max(1,C().slots.filter(s=>s.courseId===c.id).length);}
function absInfo(c,keys){keys=keys||courseKeys(c,'dev');const cfg=alertCfg(c);const total=cfg.weeks*perWeek(c);const out={};
  studentsOfC(c).forEach(s=>{let A=0;keys.forEach(k=>{if(effective(devMark(ME.id,c.id,k,s.id),leaveFor(s.id,k.slice(0,10)))==='A')A++;});
    const pct=r2(A/total*100);const active=keys.length>0;const hitD=active&&cfg.daysOn&&A>=cfg.days;const hitP=active&&cfg.pctOn&&pct>=cfg.pct;out[s.id]={A,pct,hitD,hitP,hit:hitD||hitP};});
  return {out,cfg,total,recs:keys.length};}
function runAbsAlerts(c,live){if(!ME||ME.role!=='teacher')return 0;const I=absInfo(c);let n=0;
  studentsOfC(c).forEach(s=>{const x=I.out[s.id];if(!x.hit)return;const key='abs_'+c.id+'_'+s.id+'_'+(x.hitD?'d'+I.cfg.days:'')+(x.hitP?'p'+I.cfg.pct:'');
    const IK=INB(ME.id);IK.keys=IK.keys||{};if(IK.keys[key])return;IK.keys[key]=1;touch('in_'+ME.id);n++;
    notify(ME.id,'⚠ ئاگاداری غیاب: '+s.name,`${c.name} — ${x.A} ڕۆژ غائیب بووە (${x.pct}٪ لە کۆی ${I.total} وانەی ${I.cfg.weeks} هەفتە).`+(x.hitD?`\nگەیشتە سنووری ${I.cfg.days} ڕۆژ.`:'')+(x.hitP?`\nگەیشتە سنووری ${I.cfg.pct}٪.`:''),'alert');
    if(live)toast('⚠ '+s.name+': '+x.A+' ڕۆژ غیاب ('+x.pct+'٪)','err');});
  return n;}

  $$('td.hold').forEach(td=>{
    td.addEventListener('contextmenu',e=>e.preventDefault());
    td.addEventListener('pointerdown',e=>{hide();timer=setTimeout(()=>{tip=document.createElement('div');tip.className='holdtip';tip.innerHTML=reasonHTML(c,td.dataset.k,td.dataset.s);document.body.appendChild(tip);
      const r=td.getBoundingClientRect(),w=Math.min(270,innerWidth-24);tip.style.width=w+'px';let left=r.left+r.width/2-w/2;left=Math.max(12,Math.min(innerWidth-w-12,left));tip.style.left=left+'px';
      const th=tip.offsetHeight;tip.style.top=(r.top-th-10>8?r.top-th-10:r.bottom+10)+'px';if(navigator.vibrate)try{navigator.vibrate(15)}catch(_){} },320);});
    ['pointerup','pointercancel','pointerleave'].forEach(ev=>td.addEventListener(ev,hide));});
  window.addEventListener('scroll',hide,{once:true,passive:true});}

const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();

function zipFiles(files,mime){
  const enc=new TextEncoder();const parts=[],central=[];let off=0;const d=new Date();
  const dt=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1))&0xFFFF,dd=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF;
  for(const f of files){
    const nm=enc.encode(f.name),data=enc.encode(f.data),crc=crc32(data);
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,dt,true);h.setUint16(12,dd,true);
    h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,nm.length,true);h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer),nm,data);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,dt,true);c.setUint16(14,dd,true);
    c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,nm.length,true);c.setUint16(30,0,true);c.setUint16(32,0,true);
    c.setUint16(34,0,true);c.setUint16(36,0,true);c.setUint32(38,0,true);c.setUint32(42,off,true);
    central.push(new Uint8Array(c.buffer),nm);off+=30+nm.length+data.length;
  }
  const cds=central.reduce((s,b)=>s+b.length,0);const e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(4,0,true);e.setUint16(6,0,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cds,true);e.setUint32(16,off,true);e.setUint16(20,0,true);

function paginate(rows,per){const out=[];for(let i=0;i<rows.length;i+=per)out.push(rows.slice(i,i+per));return out.length?out:[[]];}
async function canvasJpeg(cv){const b=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.9));return new Uint8Array(await b.arrayBuffer());}
async function makePDF(pages){
  const enc=new TextEncoder();const parts=[];let off=0;const xref=[];
  const put=d=>{const b=typeof d==='string'?enc.encode(d):d;parts.push(b);off+=b.length;};
  put(new Uint8Array([0x25,0x50,0x44,0x46,0x2D,0x31,0x2E,0x34,0x0A,0x25,0xE2,0xE3,0xCF,0xD3,0x0A]));
  const n=pages.length;const kids=pages.map((_,i)=>(3+i*3)+' 0 R').join(' ');
  xref[1]=off;put('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  xref[2]=off;put(`2 0 obj\n<< /Type /Pages /Kids [${kids}] /Count ${n} >>\nendobj\n`);
  for(let i=0;i<n;i++){const pg=pages[i];const pw=pg.land?841.89:595.28,ph=pg.land?595.28:841.89;const jpg=await canvasJpeg(pg.cv);const po=3+i*3,co=po+1,io=po+2;
    xref[po]=off;put(`${po} 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw} ${ph}] /Resources << /XObject << /Im${i} ${io} 0 R >> >> /Contents ${co} 0 R >>\nendobj\n`);
    const cs=`q ${pw} 0 0 ${ph} 0 0 cm /Im${i} Do Q`;xref[co]=off;put(`${co} 0 obj\n<< /Length ${cs.length} >>\nstream\n${cs}\nendstream\nendobj\n`);
    xref[io]=off;put(`${io} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${pg.W} /Height ${pg.H} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`);put(jpg);put('\nendstream\nendobj\n');}
  const total=3+n*3;const xs=off;let xr=`xref\n0 ${total}\n0000000000 65535 f \n`;for(let i=1;i<total;i++)xr+=String(xref[i]).padStart(10,'0')+' 00000 n \n';
  put(xr+`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xs}\n%%EOF\n`);
  return new Blob(parts,{type:'application/pdf'});}
/* ---------- file sheet: print · download · share · close ---------- */
async function shareFile(blob,fname,mime){
  try{const f=new File([blob],fname,{type:mime});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:fname});return true;}}
  catch(e){if(e&&e.name==='AbortError')return true;console.warn('share',e);}
  // fallback: the platform save (on iPhone this opens the share sheet)
  await saveFile(fname,blob);toast('ئەگەر لیستی ئەپەکان نەکرایەوە، فایلەکە دابەزێنرا؛ لە فایلەکانەوە بینێرە.');return false;}
function printImages(pages){

  area.innerHTML=pages.map(p=>`<img src="${p.cv.toDataURL('image/jpeg',0.92)}">`).join('');document.body.appendChild(area);

  ps.textContent=`@page{size:A4 ${pages[0]&&pages[0].land?'landscape':'portrait'};margin:0}`;

  setTimeout(()=>{const a=$('#printArea');if(a)a.remove();},4000);}
function fileSheet({title,fname,pages,xlsx}){
  let pdf=null;const getPdf=async()=>{if(!pdf){toast('PDF ئامادە دەکرێت...');pdf=await makePDF(pages);window.__lastPdf=pdf;}return pdf;};
  const ov=document.createElement('div');ov.className='fsheet';
  const info=pages?`A4 · ${pages.length} لاپەڕە · ${pages[0].land?'پانی':'درێژی'}`:'فایلی ئێکسڵ (.xlsx)';
  ov.innerHTML=`<div class="fbar"><div class="fbtns">
     ${pages?`<button class="fb print" data-a="print">🖨 چاپ</button><button class="fb" data-a="pdf">PDF ⬇</button>`:`<button class="fb print" data-a="xl">⬇ داگرتن</button>`}
     <button class="fb" data-a="share">📤 ناردن</button><button class="fb close" data-a="close">✕ داخستن</button></div>
     <div class="finfo"><b>${esc(title)}</b> · ${info}</div></div>
   <div class="fbody">${pages?`<p class="fhint">ئەگەر دوگمەی «چاپ» لە مۆبایلەکەت کاری نەکرد، «PDF» دابەزێنە یان «ناردن» بکە بۆ ئەپی چاپکەر یان PDF.</p>${pages.map((p,i)=>`<img class="fpage" src="${p.cv.toDataURL('image/jpeg',0.6)}" alt="لاپەڕە ${i+1}">`).join('')}`
     :`<div class="fxl"><div class="fxlic">XLSX</div><b dir="auto">${esc(fname)}<span dir="ltr">.xlsx</span></b><p>فایلەکە ئامادەیە. «داگرتن» بۆ پاشەکەوتکردن لە مۆبایلەکەت، یان «ناردن» بۆ واتسئاپ، ئیمەیل، تێلیگرام و ...</p></div>`}</div>`;
  document.body.appendChild(ov);document.body.style.overflow='hidden';
  const close=()=>{ov.remove();document.body.style.overflow='';};
  ov.querySelector('.fbtns').onclick=async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;

    else if(a==='share'){if(pages)await shareFile(await getPdf(),fname+'.pdf','application/pdf');else await shareFile(xlsx,fname+'.xlsx','application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');}};
}

async function printAttendance(c,mode){
  if(!c)return;await ensureFonts();const studs=studentsOfC(c);const a=S['att_'+c.id]||{s:{}};const dev=mode==='dev';
  const read=(k,sid)=>dev?devMark(ME.id,c.id,k,sid):sharedMark(c.id,k,sid);const cxl=k=>dev?devCancelled(ME.id,c.id,k):!!(a.s[k]&&a.s[k].cancelled);
  const set=new Set(Object.keys(a.s));if(dev)Object.keys(DEV(ME.id).pend).filter(p=>p.startsWith('m|'+c.id+'|')).forEach(p=>set.add(p.split('|')[2]));
  const keys=[...set].filter(k=>!cxl(k)&&!holidayOn(k.slice(0,10))&&studs.some(s=>read(k,s.id)!==undefined)).sort();
  if(!keys.length){toast('هێشتا هیچ ئامادەبوونێک بۆ ئەم وانەیە تۆمار نەکراوە','err');return;}
  const st={};studs.forEach(s=>{const k={P:0,A:0,T:0,E:0,L:0,N:0};keys.forEach(key=>{k[effective(read(key,s.id),leaveFor(s.id,key.slice(0,10)))]++;});st[s.id]=k;});
  const tot=keys.length;const MINW=58;
  // portrait first; landscape only when the sessions don't fit across a portrait page
  const fixedP=60+320+4*78+190,fixedL=60+360+4*86+200;const land=keys.length*MINW>(1654-140)-fixedP;
  const per=land?Math.floor((2339-140-fixedL)/MINW):keys.length;const chunks=[];for(let i=0;i<keys.length;i+=per)chunks.push(keys.slice(i,i+per));
  const NW=land?360:320,SW=land?86:78,TW=land?200:190,AV=(land?2339:1654)-140-(land?fixedL:fixedP);
  const lines=[`وانە: ${c.name}   ●   ${gLabel(c.stage)}   ●   مامۆستا: ${tNames(c)}`,`لە ${keys[0].slice(0,10)} تا ${keys[keys.length-1].slice(0,10)}   ●   ژمارەی وانەکان: ${tot}   ●   ژمارەی خوێندکاران: ${studs.length}`];
  const legend=[['P','ئامادە'],['A','غائیب'],['L','مۆڵەت — لە لایەن بەشەوە'],['E','مۆڵەت — لە لایەن مامۆستاوە'],['T','دواکەوتوو']];
  const plan=[];chunks.forEach(ch=>{const sw=Math.min(130,Math.floor(AV/ch.length));
    const cols=[{label:'ژ',w:60},{label:'ناوی خوێندکار',w:NW,align:'right'},...ch.map(k=>({label:+k.slice(8,10)+'/'+(+k.slice(5,7)),sub:WD[wdOf(k.slice(0,10))].replace('شەممە','ش.'),w:sw,hs:18})),
      {label:'هاتوو',w:SW},{label:'غیاب',w:SW},{label:'مۆڵەت',w:SW},{label:'درەنگ',w:SW},{label:'تێکڕا',sub:'هاتن لە کۆی وانەکان',w:TW}];
    const rows=studs.map((s,i)=>{const k=st[s.id];const came=k.P+k.T;const pct=Math.round(came/tot*100);
      return [i+1,s.name,...ch.map(key=>({icon:effective(read(key,s.id),leaveFor(s.id,key.slice(0,10)))})),{t:came,b:1,color:'#15803d'},{t:k.A,b:1,color:k.A?'#dc2626':'#94a3b8'},{t:k.E+k.L,color:'#6d28d9'},{t:k.T,color:'#b45309'},
        {t:`${came} لە ${tot}  (${pct}%)`,b:1,color:pct<75?'#dc2626':'#14213a',fill:pct<75?'#fff1f1':null}];});
    paginate(rows,land?27:42).forEach(pr=>plan.push({cols,rows:pr}));});
  const pages=plan.map(()=>newPage(land));
  plan.forEach((p,i)=>{const pg=pages[i];const y=pageFrame(pg,{title:'تۆماری ئامادەبوونی خوێندکاران',lines,legend},i+1,pages.length);const bot=drawTable(pg,y,p.cols,p.rows,{rowH:44,headH:66});
    if(i===pages.length-1){PT(pg.x,'واژووی مامۆستای وانە: ..............................',pg.W-70,Math.min(bot+70,pg.H-110),{size:22});PT(pg.x,'واژووی سەرۆکی بەش: ..............................',70+560,Math.min(bot+70,pg.H-110),{size:22});}});
  await previewAndSave(pages,safeName(c.name)+' - ئامادەبوون - '+todayISO(),'تۆماری ئامادەبوون — '+c.name);}
async function printGrades(c){
  if(!c)return;await ensureFonts();const g=GR(c.id);const studs=studentsOfC(c);const mx=r2(VC(g).reduce((a,k)=>a+(+k.max||0),0));
  const land=VC(g).length>7;const avail=(land?2339:1654)-140;const fixed=60+340+110+100+150;const cw=Math.max(80,Math.min(150,Math.floor((avail-fixed)/Math.max(1,VC(g).length))));

    const p=mx?r2(t/mx*100):0;const e=any?(p>=90?'نایاب':p>=80?'زۆر باش':p>=70?'باش':p>=60?'ناوەند':p>=50?'پەسەند':'دەرنەچوو'):'';if(any){cnt++;sum+=p;p>=50?pass++:fail++;}
    return [i+1,s.name,...cells,{t:any?fmt(t):'',b:1},any?p+'%':'',{t:e,b:1,color:e==='دەرنەچوو'?'#dc2626':'#15803d',fill:e==='دەرنەچوو'?'#fff1f1':null}];});

      PT(pg.x,'واژووی مامۆستای وانە: ..............................',pg.W-70,yy+70,{size:22});}});

/* ================= Keyboard: keep the focused field visible ================= */
(function(){
  const touch=window.matchMedia&&matchMedia('(pointer:coarse)').matches;if(!touch)return;
  let hideT=null;
  const isField=el=>el&&(el.tagName==='TEXTAREA'||(el.tagName==='INPUT'&&!['checkbox','radio','button','file','date','time'].includes(el.type)));
  function reveal(el){
    if(!el||document.activeElement!==el)return;
    const dlg=el.closest('.dlg');
    if(dlg){const r=el.getBoundingClientRect(),d=dlg.getBoundingClientRect();if(r.top<d.top+40||r.bottom>d.bottom-70)dlg.scrollTop+=r.top-d.top-60;return;}
    const box=el.closest('.tbl-wrap');
    if(box){const r=el.getBoundingClientRect(),b=box.getBoundingClientRect();if(r.left<b.left||r.right>b.right)box.scrollLeft+=(r.left+r.width/2)-(b.left+b.width/2);}
    const vv=window.visualViewport;const visH=vv?vv.height:innerHeight;
    const shrunk=visH<(screen.height||innerHeight)*0.72; // the viewport already shrank for the keyboard
    const target=shrunk?visH*0.35:Math.min(innerHeight*0.24,180);
    const r=el.getBoundingClientRect();const delta=r.top-target;
    if(Math.abs(delta)>8)window.scrollBy({top:delta,behavior:'smooth'});
    if(box){const b=box.getBoundingClientRect(),r2=el.getBoundingClientRect();if(r2.top<b.top+44||r2.bottom>b.bottom)box.scrollTop+=r2.top-b.top-90;}
  }
  document.addEventListener('focusin',e=>{const el=e.target;if(!isField(el))return;clearTimeout(hideT);window.__kbAt=Date.now();setTimeout(()=>{if(document.activeElement===el)document.body.classList.add('kb');},260);
    requestAnimationFrame(()=>reveal(el));setTimeout(()=>reveal(el),320);setTimeout(()=>reveal(el),700);});
  document.addEventListener('focusout',e=>{if(!isField(e.target))return;hideT=setTimeout(()=>{if(!isField(document.activeElement)){document.body.classList.remove('kb');window.__kbAt=Date.now();}},250);});
  if(window.visualViewport)visualViewport.addEventListener('resize',()=>{const el=document.activeElement;if(isField(el))setTimeout(()=>reveal(el),60);});
})();
