<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1e3a8a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ئامادەبوون">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<script src="config.js"></script>
<script>if('serviceWorker' in navigator&&location.protocol!=='file:'){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سیستەمی ئامادەبوون — زانکۆی سلێمانی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5f9;--card:#fff;--ink:#14213a;--muted:#64748b;--line:#e2e8f0;--pri:#1d4e89;--pri2:#2563eb;--soft:#e8f0fb;
--ok:#15803d;--okbg:#e5f6ec;--bad:#dc2626;--badbg:#fde8e8;--warn:#c2410c;--warnbg:#fff1e0;--late:#b45309;--latebg:#fef3c7;--exc:#1d4ed8;--excbg:#dbeafe;--vio:#6d28d9;--viobg:#efe9fd}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans Arabic',Tahoma,'Segoe UI',sans-serif;font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
body{padding-bottom:calc(78px + env(safe-area-inset-bottom))}
body.nologin{padding-bottom:0}
button{font:inherit;cursor:pointer}input,select,textarea{font:inherit;color:inherit}
header.top{background:linear-gradient(135deg,#0d2546,#1d4e89 60%,#2366a8);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 12px;box-shadow:0 4px 18px rgba(13,37,70,.25)}
.top-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.15);display:grid;place-items:center;flex:none;font-weight:800;font-size:13px;letter-spacing:.5px}
.hname{min-width:0;flex:1}.hname b{display:block;font-size:14.5px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hname small{opacity:.8;font-size:12px}
.hb{position:relative;width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.13);color:#fff;display:grid;place-items:center;padding:0;flex:none}
.hb svg{width:21px;height:21px}.hb .cnt{position:absolute;top:-5px;left:-5px;min-width:18px;height:18px;border-radius:9px;background:#f87171;color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 4px}.hb .cnt:empty{display:none}
.net{display:flex;align-items:center;gap:6px;border:0;border-radius:99px;padding:7px 11px;font-size:12px;font-weight:700;white-space:nowrap;flex:none}
.net.on{background:#dcfce7;color:#166534}.net.off{background:#fee2e2;color:#991b1b}
.net i{width:9px;height:9px;border-radius:50%;background:currentColor}
main{max-width:1100px;margin:0 auto;padding:14px}
nav.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-top:1px solid var(--line);z-index:40;padding:5px 4px calc(5px + env(safe-area-inset-bottom))}
nav.bottom .nin{max-width:680px;margin:0 auto;display:flex}
nav.bottom button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:var(--muted);padding:6px 0;border-radius:12px;position:relative}
nav.bottom button svg{width:23px;height:23px}
nav.bottom button.on{color:var(--pri);font-weight:700}nav.bottom button.on svg{background:var(--soft);border-radius:9px;padding:2px;width:34px}
nav.bottom .dot{position:absolute;top:2px;left:50%;margin-left:6px;min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(16,24,40,.04)}
.card h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px;font-weight:700;flex-wrap:wrap}
.card h2 .sp{margin-inline-start:auto}
.muted{color:var(--muted);font-size:13px}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:#eef2f7;color:var(--ink);font-size:14px;line-height:1.3}
.btn.pri{background:var(--pri);color:#fff}.btn.ok{background:var(--ok);color:#fff}.btn.danger{background:var(--badbg);color:var(--bad)}.btn.outline{background:#fff;border:1.5px solid var(--line)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}.btn.block{width:100%}.btn.xl{background:#107c41;color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grow{flex:1;min-width:0}
.inp{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;outline:none}
.inp:focus{border-color:var(--pri2);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
textarea.inp{min-height:110px;resize:vertical}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}.field label{font-size:13px;color:var(--muted);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}@media(min-width:720px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;position:relative;overflow:hidden}
.stat b{font-size:24px;display:block;font-weight:800;line-height:1.2}.stat span{color:var(--muted);font-size:12.5px}
.stat::after{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--c,var(--pri))}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 13px;font-size:13px;font-weight:600;color:#334155;flex:none}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.b-ok{background:var(--okbg);color:var(--ok)}.b-warn{background:var(--warnbg);color:var(--warn)}.b-bad{background:var(--badbg);color:var(--bad)}.b-n{background:#eef2f7;color:#475569}.b-pri{background:var(--soft);color:var(--pri)}.b-vio{background:var(--viobg);color:var(--vio)}.b-late{background:var(--latebg);color:var(--late)}.b-exc{background:var(--excbg);color:var(--exc)}
.list .it{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}.list .it:last-child{border:0}
.slist{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.num{width:32px;height:32px;border-radius:10px;background:#eef2f7;display:grid;place-items:center;font-weight:700;font-size:13px;color:#334155;flex:none}
.ibtn{border:0;background:#f1f5f9;border-radius:9px;width:34px;height:34px;display:grid;place-items:center;color:#475569;flex:none}
.ibtn svg{width:17px;height:17px}.ibtn.red{color:var(--bad);background:var(--badbg)}
.empty{text-align:center;padding:26px 16px;color:var(--muted)}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:flex-end;justify-content:center;z-index:100;animation:fd .15s}
.dlg{background:#fff;width:100%;max-width:580px;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom));animation:up .2s}
.dlg h3{margin:0 0 12px;font-size:17px}.dlg .acts{display:flex;gap:8px;margin-top:14px;position:sticky;bottom:0;background:#fff;padding-top:8px}.dlg .acts .btn{flex:1}
@media(min-width:640px){.ov{align-items:center}.dlg{border-radius:22px}}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}@keyframes fd{from{opacity:0}to{opacity:1}}
#toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.tst{background:#14213a;color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:up .2s;max-width:90vw}.tst.err{background:#b91c1c}.tst.ok{background:#15803d}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff;max-height:70vh}
table.gt{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:13.5px}
.gt th{position:sticky;top:0;background:#1d4e89;color:#fff;font-size:12.5px;padding:8px 6px;z-index:2;white-space:nowrap;font-weight:700}
.gt th small{display:block;opacity:.8;font-weight:400;font-size:11px}
.gt td{border-bottom:1px solid var(--line);padding:5px;text-align:center;background:#fff;white-space:nowrap}
.gt tr:nth-child(even) td{background:#fafbfd}
.gt td+td{border-inline-start:1px solid #dbe4f0}.gt th+th{border-inline-start:1px solid rgba(255,255,255,.22)}
#gt tbody td:nth-child(even):not(.c-n):not(.c-nm){background:#f1f6fd}
#gt tbody tr:nth-child(even) td:nth-child(even):not(.c-n):not(.c-nm){background:#e8f0fb}
#gt thead th:nth-child(even):not(.c-n):not(.c-nm):not(.colon):not(.attcol){background:#2a5f9e}
#gt tbody tr:focus-within td{background:#fff8e1!important}
.gt .c-n{position:sticky;right:0;z-index:1;width:40px;min-width:40px;font-weight:700;color:#475569}
.gt .c-nm{position:sticky;right:40px;z-index:1;min-width:150px;text-align:right;font-weight:600;box-shadow:-1px 0 0 var(--line)}
.gt th.c-n,.gt th.c-nm{z-index:3;background:#173f70}
.gi{width:58px;text-align:center;padding:7px 3px;border:1.5px solid var(--line);border-radius:9px;direction:ltr;background:#fff;outline:none;font-weight:600}
.gi.bad{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.st{display:inline-grid;place-items:center;min-width:28px;height:26px;border-radius:8px;font-weight:800;font-size:12px}
.st.P{background:var(--okbg);color:var(--ok)}.st.A{background:var(--badbg);color:var(--bad)}.st.T{background:var(--latebg);color:var(--late)}.st.E{background:var(--excbg);color:var(--exc)}.st.L{background:var(--viobg);color:var(--vio)}.st.N{background:#f1f5f9;color:#94a3b8}
/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#0d2546,#1d4e89 55%,#2f7bbf)}
.lbox{background:#fff;border-radius:22px;padding:26px 20px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.lbox .lg{width:64px;height:64px;border-radius:18px;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:800;margin:0 auto 10px;font-size:17px}
.lbox h1{text-align:center;font-size:19px;margin:0}.lbox p.c{text-align:center;color:var(--muted);margin:2px 0 18px;font-size:13.5px}
.demo{margin-top:16px;border-top:1px dashed var(--line);padding-top:12px}
.demo button{display:flex;width:100%;align-items:center;gap:10px;border:1px solid var(--line);background:#fafbfd;border-radius:12px;padding:8px 10px;margin-bottom:6px;text-align:right}
.demo button b{font-size:13.5px}.demo button span{margin-inline-start:auto;font-size:12px;color:var(--muted);direction:ltr}
/* attendance rows */
.arow{display:grid;grid-template-columns:32px 1fr auto;gap:6px 10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.arow:last-child{border-bottom:0}
.arow .nm{font-weight:600;font-size:14.5px;line-height:1.4;word-break:break-word}
.arow .sub{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:2px}
.actl{display:flex;align-items:center;gap:8px}
.tg{position:relative;width:54px;height:32px;border-radius:16px;border:0;padding:0;background:#e5e9f0;box-shadow:inset 0 0 0 1px #d5dbe5;transition:background .2s;flex:none}
.tg::after{content:"";position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:right .2s}
.tg.on{background:#22c55e;box-shadow:none}.tg.on::after{right:25px}
.tg.none{background:#fff;box-shadow:inset 0 0 0 1.5px #c3ccd8;outline:1.5px dashed #c3ccd8;outline-offset:-1.5px}.tg.none::after{opacity:.35}
.opts{grid-column:1/-1;display:none;gap:6px}
.arow.off .opts{display:flex}
.opt{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:7px 4px;font-size:13px;font-weight:700;color:#64748b}
.opt[data-s=A].on{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[data-s=T].on{background:#f59e0b;border-color:#f59e0b;color:#fff}
.opt[data-s=E].on{background:var(--exc);border-color:var(--exc);color:#fff}
.opt.clr{flex:none;color:#64748b;border-style:dashed;padding:7px 9px}
.opt.official{background:var(--viobg)!important;border-color:var(--vio)!important;color:var(--vio)!important}
.nbtn{border:0;background:#f1f5f9;border-radius:9px;width:34px;height:34px;display:grid;place-items:center;color:#94a3b8;flex:none}
.nbtn.has{background:#fef3c7;color:#b45309}
.nbtn svg{width:17px;height:17px}
@media(min-width:760px){.arow{grid-template-columns:36px 1fr auto auto}.opts{grid-column:auto}.arow.off .opts{display:flex}.opt{flex:none;padding:7px 12px}}
.counters{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0 4px}
.counters div{border-radius:12px;padding:7px 4px;text-align:center;font-size:11px;font-weight:600}.counters b{display:block;font-size:18px;line-height:1.2}
.cP{background:var(--okbg);color:var(--ok)}.cA{background:var(--badbg);color:var(--bad)}.cT{background:var(--latebg);color:var(--late)}.cE{background:var(--excbg);color:var(--exc)}.cN{background:#eef2f7;color:#475569}
.lec{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff;margin-bottom:8px;cursor:pointer}
.lec .tm{min-width:62px;text-align:center;background:var(--soft);color:var(--pri);border-radius:11px;padding:6px 4px;font-weight:800;line-height:1.2;font-size:14px;direction:ltr}
.lec .tm small{display:block;font-size:10.5px;font-weight:600}
.lec .tm.tm-due{background:#fee2e2;color:#b91c1c;box-shadow:inset 0 0 0 2px #f87171}
.lec.lc-up{background:#eff6ff;border-color:#bfdbfe}.lec.lc-due{background:#fef2f2;border-color:#fca5a5}.lec.lc-ok{background:#f0fdf4;border-color:#86efac}.lec.lc-x{background:#f8fafc}
.badge.b-up{background:#dbeafe;color:#1d4ed8}.lec .tm.tm-ok{background:#dcfce7;color:#15803d;box-shadow:inset 0 0 0 2px #4ade80}.lec .tm.tm-x{background:#f1f5f9;color:#94a3b8}
.banner{border-radius:14px;padding:11px 13px;margin-bottom:12px;font-size:13.5px;display:flex;gap:10px;align-items:center}
.banner.off{background:#fee2e2;color:#991b1b}.banner.info{background:var(--soft);color:var(--pri)}.banner.warn{background:var(--warnbg);color:var(--warn)}.banner.ok{background:var(--okbg);color:var(--ok)}
.notif{padding:11px 12px;border-bottom:1px solid var(--line);display:flex;gap:10px}.notif:last-child{border:0}.notif.unread{background:#f6f9ff}
.notif .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--soft);color:var(--pri)}.notif .ic svg{width:19px;height:19px}
.sumline{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--soft);border-radius:12px;font-weight:700;color:var(--pri);margin:6px 0}
.catrow{display:grid;grid-template-columns:1fr 72px 34px 34px;gap:6px;align-items:center;margin-bottom:8px}
.search{position:relative}.search input{padding-inline-start:36px}.search svg{position:absolute;right:11px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:#94a3b8}
.priv{background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:9px 11px;font-size:12.5px;color:#92400e;margin-bottom:8px}
.offnote{background:var(--viobg);border:1px solid #ddd0fb;border-radius:12px;padding:10px 12px;color:#4c1d95;margin-bottom:10px}
.loading{position:fixed;inset:0;background:var(--bg);z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--muted)}
.spin{width:38px;height:38px;border:4px solid #dbe4f0;border-top-color:var(--pri);border-radius:50%;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.tabs2{display:flex;background:#e6ebf2;border-radius:13px;padding:4px;margin-bottom:10px;gap:4px}.tabs2 button{flex:1;border:0;background:none;border-radius:10px;padding:9px 4px;font-weight:700;font-size:13.5px;color:#475569}.tabs2 button.on{background:#fff;color:var(--pri);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}.calhead b{font-size:15px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.cal .d.fri{background:transparent;color:#e11d48}.cal .h.fri{color:#e11d48}
.cal .h{font-size:10.5px;color:var(--muted);text-align:center;font-weight:700;padding-bottom:2px;line-height:1.3}
.cal .d{position:relative;border:0;border-radius:11px;background:#f8fafc;font-weight:700;font-size:14px;height:42px;color:#334155;padding:0}
.cal .d i{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);min-width:7px;height:7px;border-radius:4px;background:var(--pri2);font-style:normal;font-size:0}
.cal .d.has{background:#eef4ff}
.cal .d.done i{background:#16a34a}.cal .d.miss i{background:#f59e0b}.cal .d.miss{background:#fff7e6}
.cal .d.hol{background:#fde8e8;color:#b91c1c}
.cal .d.today{box-shadow:inset 0 0 0 2px var(--pri)}
.cal .d.sel{background:var(--pri);color:#fff}.cal .d.sel i{background:#fff}
.calleg{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:11.5px;color:var(--muted)}.calleg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:4px;vertical-align:middle}
.dayhead{font-weight:800;font-size:15px;margin:4px 4px 10px}
.banner.hol{background:#fde8e8;color:#991b1b}
.lec.holl{opacity:.7;cursor:default;background:#fff7f7}
body.kb{padding-bottom:var(--kbh,0px)}
body.kb nav.bottom{display:none}
body.kb .ov{align-items:flex-start}
body.kb .dlg{max-height:50vh;border-radius:0 0 22px 22px;padding-bottom:12px;animation:none}
body.kb #toast{bottom:auto;top:12px}
.gt th.colon{background:#f59e0b!important;color:#fff}
.gi.colon{border-color:#fbbf24;background:#fffbeb}
.gi.colon:focus{border-color:#2563eb;background:#fff}
.dlg .acts{flex-wrap:wrap}.dlg .acts .btn{flex:1 1 30%}
.auto{display:inline-block;min-width:50px;padding:6px 8px;border-radius:9px;background:var(--soft);color:var(--pri);font-weight:800}
.gt th.attcol{background:#0e7490}
.catrow .att{grid-column:1/2;font-size:11.5px;color:#0e7490;font-weight:700;margin-top:-4px}
.sumline.bad{background:var(--badbg);color:var(--bad)}
.switch{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0;font-size:14px}.switch input[type=checkbox]{width:20px;height:20px;accent-color:var(--pri)}
.sep{height:1px;background:var(--line);margin:8px 0}
.fsheet{position:fixed;inset:0;z-index:150;background:#3f4a5a;display:flex;flex-direction:column;animation:fd .15s}
.fbar{background:#1b2230;padding:calc(10px + env(safe-area-inset-top)) 10px 8px;box-shadow:0 4px 14px rgba(0,0,0,.3)}

/* ---- shared: document diff / apply (used by server and app) ---- */
function uosIsObj(x){return x!==null&&typeof x==='object'&&!Array.isArray(x);}
function uosIsIdArr(a){if(!Array.isArray(a))return false;for(var i=0;i<a.length;i++){if(!uosIsObj(a[i])||typeof a[i].id!=='string')return false;}return true;}
function uosDiff(a,b,p,out){
  out=out||[];p=p||[];
  if(a===b)return out;
  if(uosIsObj(a)&&uosIsObj(b)){
    var k;for(k in b){if(!Object.prototype.hasOwnProperty.call(b,k))continue;if(!Object.prototype.hasOwnProperty.call(a,k)){if(b[k]!==undefined)out.push({p:p.concat([k]),v:b[k]});}else uosDiff(a[k],b[k],p.concat([k]),out);}
    for(k in a){if(Object.prototype.hasOwnProperty.call(a,k)&&!Object.prototype.hasOwnProperty.call(b,k))out.push({p:p.concat([k]),d:1});}
    return out;}
  if(Array.isArray(a)&&Array.isArray(b)&&(a.length||b.length)&&uosIsIdArr(a)&&uosIsIdArr(b)){
    var ia={},ib={},i;for(i=0;i<a.length;i++)ia[a[i].id]=a[i];for(i=0;i<b.length;i++)ib[b[i].id]=b[i];
    var firstOld=b.length;for(i=0;i<b.length;i++){if(ia[b[i].id]){firstOld=i;break;}}
    var front=[];
    for(i=0;i<b.length;i++){var e=b[i];
      if(!ia[e.id]){if(a.length&&i<firstOld)front.push({p:p.concat(['#'+e.id]),v:e,pos:'f'});else out.push({p:p.concat(['#'+e.id]),v:e,pos:'e'});}
      else uosDiff(ia[e.id],e,p.concat(['#'+e.id]),out);}
    for(i=front.length-1;i>=0;i--)out.push(front[i]);
    for(i=0;i<a.length;i++){if(!ib[a[i].id])out.push({p:p.concat(['#'+a[i].id]),d:1});}
    return out;}
  if(JSON.stringify(a)===JSON.stringify(b))return out;
  out.push({p:p,v:b});return out;
}
function uosIdx(arr,id){for(var i=0;i<arr.length;i++){if(arr[i]&&arr[i].id===id)return i;}return -1;}
function uosApply(root,op){
  var p=op.p;if(!p.length)return op.d?null:op.v;
  if(root===null||root===undefined||typeof root!=='object')root={};
  var cur=root;
  for(var i=0;i<p.length-1;i++){var seg=p[i],nx;
    if(Array.isArray(cur)&&seg.charAt(0)==='#'){var j=uosIdx(cur,seg.slice(1));if(j<0)return root;nx=cur[j];}
    else{if(cur[seg]===null||cur[seg]===undefined||typeof cur[seg]!=='object'){if(op.d)return root;cur[seg]={};}nx=cur[seg];}
    cur=nx;}
  var last=p[p.length-1];
  if(Array.isArray(cur)&&last.charAt(0)==='#'){var x=uosIdx(cur,last.slice(1));
    if(op.d){if(x>=0)cur.splice(x,1);}else if(x>=0)cur[x]=op.v;else if(op.pos==='f')cur.unshift(op.v);else cur.push(op.v);}
  else{if(op.d)delete cur[last];else cur[last]=op.v;}
  return root;
}
function uosFill(dst,src){ /* add what is missing in dst from src, keep everything dst has */
  if(uosIsObj(dst)&&uosIsObj(src)){for(var k in src){if(!Object.prototype.hasOwnProperty.call(src,k))continue;if(dst[k]===undefined)dst[k]=src[k];else dst[k]=uosFill(dst[k],src[k]);}return dst;}
  if(uosIsIdArr(dst)&&uosIsIdArr(src)){for(var i=0;i<src.length;i++){if(uosIdx(dst,src[i].id)<0)dst.push(src[i]);}return dst;}
  return dst;
}

/* ---- local cache: IndexedDB (falls back to localStorage) ---- */
const IDB={db:undefined,
  open(){if(this.db!==undefined)return Promise.resolve(this.db);return new Promise(res=>{try{const r=indexedDB.open('uos_live',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>{this.db=null;res(null)};}catch(e){this.db=null;res(null)}});},
  async get(k){const db=await this.open();if(!db){const v=lsGet(':'+k);return v?JSON.parse(v):undefined;}return new Promise(res=>{try{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(undefined);}catch(e){res(undefined)}});},
  async setMany(obj){const db=await this.open();if(!db){Object.entries(obj).forEach(([k,v])=>lsSet(':'+k,v===undefined?null:JSON.stringify(v)));return;}
    return new Promise(res=>{try{const tx=db.transaction('kv','readwrite');const st=tx.objectStore('kv');Object.entries(obj).forEach(([k,v])=>{if(v===undefined)st.delete(k);else st.put(v,k);});tx.oncomplete=()=>res();tx.onerror=()=>res();}catch(e){res()}});},
  async clear(){const db=await this.open();if(!db){try{Object.keys(localStorage).filter(k=>k.startsWith(LS+':')).forEach(k=>localStorage.removeItem(k))}catch(e){}return;}
    return new Promise(res=>{try{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').clear();tx.oncomplete=()=>res();tx.onerror=()=>res();}catch(e){res()}});}
};
const toSave=new Set();let saveT=null;
function saveKey(k){toSave.add(k);clearTimeout(saveT);saveT=setTimeout(persist,300);}
async function persist(){const o={};toSave.forEach(k=>{o['S:'+k]=clone(S[k]);o['B:'+k]=clone(B[k]);});toSave.clear();
  o.meta={keys:Object.keys(S).filter(k=>!k.startsWith('dev_')),VER,DIRTY,dev:Object.fromEntries(Object.keys(S).filter(k=>k.startsWith('dev_')).map(k=>[k,S[k]]))};await IDB.setMany(o);}
async function loadCache(){const m=await IDB.get('meta');if(!m)return;Object.assign(VER,m.VER||{});Object.assign(DIRTY,m.DIRTY||{});Object.assign(S,m.dev||{});
  for(const k of m.keys||[]){const s=await IDB.get('S:'+k),b=await IDB.get('B:'+k);if(s!==undefined)S[k]=s;if(b!==undefined)B[k]=b;}}

function touch(k){if(k.startsWith('dev_'))return;if(!DIRTY[k])DIRTY[k]=Date.now();saveKey(k);clearTimeout(NET.push);NET.push=setTimeout(()=>syncNow(),2500);if(NET.state==='ok')NET.state='pend';updateNetSoon();}
let unT=null;function updateNetSoon(){clearTimeout(unT);unT=setTimeout(()=>{if(typeof updateNet==='function'&&ME)updateNet();},250);}
function opWeight(k,op){if(k.startsWith('att_')&&op.p[0]==='s'){if(op.p.length===1)return 1;if(op.p.length===2)return op.v&&op.v.m?Math.max(1,Object.keys(op.v.m).length):1;return op.p[2]==='m'||op.p[2]==='cancelled'?1:0;}
  if(k.startsWith('in_')&&['read','seen'].includes(op.p[op.p.length-1]))return 0;return 1;}
function pendingCount(){let n=0;Object.keys(DIRTY).forEach(k=>{try{uosDiff(B[k]===undefined?null:B[k],S[k]===undefined?null:S[k]).forEach(op=>n+=opWeight(k,op))}catch(e){}});return n;}
/* ---- transport: google.script.run inside the Google page, fetch elsewhere ---- */
function api(req,ms=60000){
  return new Promise((res,rej)=>{let done=false;const to=setTimeout(()=>{if(!done){done=true;rej(new Error('timeout'))}},ms);
    const ok=v=>{if(done)return;done=true;clearTimeout(to);res(v)},bad=e=>{if(done)return;done=true;clearTimeout(to);rej(e)};
    if(IN_GAS()){google.script.run.withSuccessHandler(s=>{try{ok(JSON.parse(s))}catch(e){bad(e)}}).withFailureHandler(bad).api(JSON.stringify(req));return;}
    if(!SRV){bad(new Error('noserver'));return;}
    fetch(SRV,{method:'POST',body:JSON.stringify(req),headers:{'Content-Type':'text/plain;charset=utf-8'},redirect:'follow'}).then(r=>r.json()).then(ok,bad);});
}
/* ---- sync: send local changes, receive what others changed ---- */
function syncNow(){
  if(!TOKEN)return Promise.resolve(null);
  if(NET.busy){NET.again=true;return NET.busy;}
  NET.busy=(async()=>{
    clearTimeout(NET.push);clearTimeout(NET.retry);NET.state='busy';updateNetSoon();
    const sent={},ops={},age={},now=Date.now();let pc=0;
    Object.keys(DIRTY).forEach(k=>{const o=uosDiff(B[k]===undefined?null:B[k],S[k]===undefined?null:S[k]);if(o.length){ops[k]=o;age[k]=now-DIRTY[k];sent[k]=clone(S[k]);pc+=o.length;}else{delete DIRTY[k];saveKey(k);}});
    let res;
    try{res=await api({a:'sync',t:TOKEN,ops,age,have:Object.assign({},VER),pc,dev:(navigator.userAgent||'').replace(/^Mozilla\/5\.0 \(/,'').slice(0,60)});}
    catch(e){NET.state='off';NET.err=String(e&&e.message||e);NET.pc=pc;NET.retry=setTimeout(()=>syncNow(),30000);updateNetSoon();return {ok:false,off:true};}
    if(!res||!res.ok){NET.state='err';NET.err=res&&res.err||'';updateNetSoon();
      if(res&&res.err==='auth'){sessionEnded();}else NET.retry=setTimeout(()=>syncNow(),60000);return res;}
    let visible=false;
    (res.denied||[]).forEach(k=>{if(B[k]!==undefined)S[k]=clone(B[k]);else delete S[k];delete DIRTY[k];delete sent[k];saveKey(k);});
    const keys=new Set([...Object.keys(sent),...Object.keys(res.docs||{})]);
    keys.forEach(k=>{const r=(res.docs||{})[k];const base=r?r.d:B[k];const pre=sent[k]!==undefined?sent[k]:B[k];
      const delta=uosDiff(pre===undefined?null:pre,S[k]===undefined?null:S[k]);const before=JSON.stringify(S[k]);
      let nd=clone(base);delta.forEach(op=>{nd=uosApply(nd,op)});
      if(r){B[k]=r.d;VER[k]=r.v;}
      if(nd===undefined||nd===null){if(r)S[k]=clone(r.d);}else S[k]=nd;
      if(delta.length){if(!DIRTY[k])DIRTY[k]=Date.now();}else delete DIRTY[k];
      if(JSON.stringify(S[k])!==before)visible=true;saveKey(k);});
    (res.gone||[]).forEach(k=>{delete S[k];delete B[k];delete VER[k];delete DIRTY[k];saveKey(k);visible=true;});
    Object.keys(S).filter(k=>k.startsWith('dev_')).forEach(k=>delete S[k]);
    Object.entries(res.dev||{}).forEach(([uid,d])=>{S['dev_'+uid]=Object.assign({online:true,pend:{}},d);});
    if(res.gm){GM=res.gm;lsSet('_gm',JSON.stringify(GM));}
    if(processDelReqs())visible=true;
    saveKey('__meta');
    NET.lastOk=Date.now();lsSet('_ok',String(NET.lastOk));NET.pc=pendingCount();NET.state=NET.pc?'pend':'ok';NET.err='';
    if(S.core&&MYID){const u=user(MYID);if(!u||u.active===false){sessionEnded('inactive');return res;}if(ME&&u!==ME)ME=u;}
    updateNetSoon();if(visible)softRender();
    return res;
  })().finally(()=>{const again=NET.again;NET.busy=false;NET.again=false;if(again||Object.keys(DIRTY).length&&NET.state==='pend')setTimeout(()=>syncNow(),again?50:3000);});
  return NET.busy;
}

function withExtra(c,base){const xs=c.extra||[];if(!xs.length)return base;const ids=new Set(base.map(x=>x.id));const pool=c.arch?((arDoc(c.arch)||{}).studs||[]):C().students;

function leaveFor(sid,dk){dk=String(dk);const date=dk.slice(0,10),key=dk.length>10?dk:null;return C().leaves.find(l=>!l.cancelled&&l.studentId===sid&&l.from<=date&&date<=l.to&&(!l.only||!key||l.only.includes(key)));}
function lecturesOf(sid,from,to){ // [{course,slot,date}]
  const st=C().students.find(s=>s.id===sid);if(!st)return[];const out=[];
  const inC=c=>c&&((c.stage===st.stage&&secFits(c,st))||(c.extra||[]).includes(sid));
  for(let d=from;d<=to;d=addDays(d,1)){if(holidayOn(d))continue;const wd=wdOf(d);C().slots.filter(sl=>sl.weekday===wd).forEach(sl=>{const c=course(sl.courseId);if(inC(c))out.push({c,sl,date:d,key:d+'_'+sl.id});});if(out.length>200)break;}
  C().courses.filter(inC).forEach(c=>mkList(c.id).filter(m=>m.date>=from&&m.date<=to).forEach(m=>out.push({c,sl:{id:m.key.slice(11),start:m.s,end:m.e},date:m.date,key:m.key,mk:true})));
  return out.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.sl.start<b.sl.start?-1:1);

function devFrac(tid,cid,key,sid){const p=DEV(tid).pend['f|'+cid+'|'+key+'|'+sid];if(p!==undefined)return p===null?0.5:p;const a=S['att_'+cid];const f=a&&a.s[key]&&a.s[key].f;return f&&f[sid]||0.5;}

function applyWrite(path,val,ts){
  const p=path.split('|'),t=p[0];
  if(t==='m'){const a=ATT(p[1]);const ses=a.s[p[2]]||(a.s[p[2]]={m:{}});const tm=ses.t||(ses.t={});const old=ses.m[p[3]];
    if(val===null){delete ses.m[p[3]];delete tm[p[3]];}else{ses.m[p[3]]=val;tm[p[3]]=ts||Date.now();}
    if(old!==undefined&&old!==val){const h=ses.h||(ses.h=[]);h.push(Object.assign({s:p[3],from:old,to:val,at:ts||Date.now()},ME?{by:ME.id}:{}));if(h.length>200)h.shift();}
    ses.at=Date.now();touch('att_'+p[1]);}
  else if(t==='g'){const g=GR(p[1]);const r=g.sc[p[2]]||(g.sc[p[2]]={});if(val===null)delete r[p[3]];else r[p[3]]=val;touch('gr_'+p[1]);}

const LOCK_MS=3*36e5;
function devMarkTime(tid,cid,key,sid){const d=DEV(tid);const p='m|'+cid+'|'+key+'|'+sid;if(d.pend[p]!==undefined)return (d.pendT&&d.pendT[p])||Date.now();
  const a=S['att_'+cid];const ses=a&&a.s[key];if(!ses||ses.m[sid]===undefined)return null;return (ses.t&&ses.t[sid])||ses.at||null;}
function isLocked(tid,cid,key,sid){const m=devMark(tid,cid,key,sid);if(m===undefined)return false;const t=devMarkTime(tid,cid,key,sid);return !t||Date.now()-t>LOCK_MS;}
function courseKeys(c,mode){const studs=studentsOfC(c);const a=S['att_'+c.id]||{s:{}};const dev=mode==='dev';
  const read=(k,sid)=>dev?devMark(ME.id,c.id,k,sid):sharedMark(c.id,k,sid);const cxl=k=>dev?devCancelled(ME.id,c.id,k):!!(a.s[k]&&a.s[k].cancelled);

  return [...set].filter(k=>!cxl(k)&&(isMk(k)||!holidayOn(k.slice(0,10),termOf(c)))&&studs.some(s=>read(k,s.id)!==undefined)).sort();}
/* a lecture counts by its length: a 2-hour lecture weighs twice a 1-hour one */
const hm=t=>{const[a,b]=String(t||'0:0').split(':').map(Number);return a*60+(b||0);};
function slotHours(slotId){const sl=slotById(slotId);if(!sl)return 1;const h=(hm(sl.end)-hm(sl.start))/60;return h>0?Math.round(h*4)/4:1;}
const keyHours=(k,cid)=>{if(isMk(k)){const m=cid&&mkOf(cid,k);const h=m?(hm(m.e)-hm(m.s))/60:0;return h>0?Math.round(h*4)/4:1;}return slotHours(k.slice(11));};
function weekHours(c){return Math.max(1,r2(slotsOfC(c).reduce((a,s)=>a+slotHours(s.id),0)));}
const weekNo=d=>{const[y,m,dd]=d.split('-').map(Number);return Math.floor((Date.UTC(y,m-1,dd)/864e5+5)/7);};
const weeksRecorded=keys=>new Set(keys.map(k=>weekNo(k.slice(0,10)))).size;
function attScore(c,sid,max,keys){keys=keys||courseKeys(c,'dev');if(!keys.length)return null;let came=0,tot=0;
  keys.forEach(k=>{const w=keyHours(k,c.id);tot+=w;const e=effective(devMark(ME.id,c.id,k,sid),leaveFor(sid,k));if(e==='P'||e==='E'||e==='L')came+=w;else if(e==='T')came+=w*devFrac(ME.id,c.id,k,sid);});
  return {v:r2(max*came/tot),came:r2(came),tot:r2(tot)};}

function syncHealth(t){
  const d=S['dev_'+t.id]||{};const th=C().threshold||7;const today=todayISO();
  const days=d.lastSync?Math.floor((Date.now()-d.lastSync)/DAY):null;
  let missing=0;C().courses.filter(c=>teaches(c,t.id)).forEach(c=>{for(let k=1;k<=7;k++){const dt=addDays(today,-k);if(holidayOn(dt))continue;C().slots.filter(sl=>sl.courseId===c.id&&sl.weekday===wdOf(dt)).forEach(sl=>{const a=S['att_'+c.id];const ss=a&&a.s[dt+'_'+sl.id];if(!ss||(!ss.cancelled&&!Object.keys(ss.m||{}).length))missing++;});}});
  let lvl,label;
  if(!d.lastLogin){lvl='never';label='هەرگیز بەکارنەهێنراوە';}
  else if(days>=th){lvl='bad';label='باکئەپ نەکراوە';}
  else if(days>=2){lvl='warn';label='دواکەوتوو';}
  else if(missing){lvl='miss';label='ئامادەبوون نەگەیشتووە';}

  return {lvl,label,days,missing,lastSync:d.lastSync,lastLogin:d.lastLogin};
}

  $$('#cfS .chip').forEach(b=>b.onclick=()=>{CF.st=b.dataset.v;vCourses();});$$('#cfH .chip').forEach(b=>b.onclick=()=>{CF.sh=b.dataset.v;vCourses();});

  const cs=fixed?[fixed]:[...C().courses].sort((a,b)=>(a.stage<b.stage?-1:a.stage>b.stage?1:0)||collator.compare(a.name,b.name));
  if(!cs.length){toast('هیچ وانەیەک نییە','err');return;}
  const st0=fixed?(nextStage(fixed.stage)||fixed.stage):(UI.stage||GROUPS[0]);
  const r=await modal('📎 زیادکردنی خوێندکاری سەربار',`
   <div class="field"><label>١. قۆناغی خوێندکارەکە</label><select class="inp" id="xg">${GROUPS.map(g=>`<option value="${g}" ${g===st0?'selected':''}>${gLabel(g)} (${gCount(g)})</option>`).join('')}</select></div>
   <div class="field"><label>٢. خوێندکار</label><div class="search" style="margin:0 0 6px">${IC.search}<input class="inp" id="xq" placeholder="گەڕان بەدوای ناو..."></div><div class="xpick" id="xl"></div></div>
   ${fixed?`<div class="banner info" style="display:block;margin:0">بۆ وانەی <b>${esc(fixed.name)}</b> — ${gLabel(fixed.stage)}</div>`:`<div class="field"><label>٣. وانە (دەتوانیت زیاتر لە یەکێک هەڵبژێریت)</label><div class="xpick" id="xc">${GROUPS.filter(g=>cs.some(c=>c.stage===g)).map(g=>`<div class="pgh">${gLabel(g)}</div>${cs.filter(c=>c.stage===g).map(c=>`<label class="prow"><input type="checkbox" value="${c.id}"><span class="grow">${esc(c.name)}${secTag(c)}</span><span class="pst">${esc(tNames(c)||'')}</span></label>`).join('')}`).join('')}</div></div>`}`,
   [{label:'پاشگەزبوونەوە',value:null},{label:'زیادکردن',cls:'pri',check:ov=>{if(!$('#xl input:checked',ov)){toast('خوێندکارێک هەڵبژێرە','err');return false;}if(!fixed&&!$('#xc input:checked',ov)){toast('وانەیەک هەڵبژێرە','err');return false;}return true;},
     get:ov=>({sid:$('#xl input:checked',ov).value,cids:fixed?[fixed.id]:$$('#xc input:checked',ov).map(x=>x.value)})}],
   ov=>{const fill=()=>{const g=$('#xg',ov).value;$('#xl',ov).innerHTML=studentsOf(g).map(st=>`<label class="prow" data-n="${esc(st.name)}"><input type="radio" name="xs" value="${st.id}"><span class="grow">${esc(st.name)}</span></label>`).join('')||'<div class="muted" style="padding:8px">هیچ خوێندکارێک لەم قۆناغەدا نییە</div>';$('#xq',ov).value='';};
     fill();$('#xg',ov).onchange=fill;$('#xq',ov).oninput=e=>{const q=e.target.value.trim();$$('#xl .prow',ov).forEach(row=>row.style.display=!q||nameMatch(row.dataset.n,q)?'':'none');};});
  if(!r)return;const st=C().students.find(x=>x.id===r.sid);let n=0;
  r.cids.forEach(cid=>{const c=C().courses.find(x=>x.id===cid);if(!c)return;if(c.stage===st.stage&&secFits(c,st))return;const xs=c.extra||[];if(xs.includes(st.id))return;c.extra=xs.concat(st.id);n++;
    if(isAdmin())tIds(c).forEach(tid=>notify(tid,'خوێندکاری سەربار: '+st.name,`${st.name} (${stNo(st.stage)}) وەک سەربار زیاد کرا بۆ وانەی ${c.name}. لە کۆتایی لیستی ئامادەبوون و نمرەکاندا دەردەکەوێت.`,'info'));});
  if(!n){toast('ئەم خوێندکارە پێشتر لەم وانەیەدایە','err');return;}
  touch('core');toast(`${st.name} وەک سەربار زیاد کرا ✓`,'ok');if(rerender)rerender();}

   <div class="legend"><span class="st P">✓</span><span class="muted">ئامادە</span><span class="st A">ن</span><span class="muted">نەهاتوو</span><span class="st T">د</span><span class="muted">دواکەوتوو</span><span class="st E">م</span><span class="muted">مۆڵەت لە لایەن مامۆستاوە</span><span class="st L">ب</span><span class="muted">مۆڵەت لە لایەن بەشەوە</span></div>

   ${c.arch?`<div class="banner info" style="margin-top:12px">📦<div>ئەم وانەیە لە ئەرشیفی <b>${esc(arName(ARCH().find(a=>a.id===c.arch)||{}))}</b>دایە — تەنها بۆ خوێندنەوە، ناگۆڕدرێت.</div></div>`:`<div class="banner info" style="margin-top:12px">${ic('edit',20)}<div>بۆ گۆڕینی دۆخی خوێندکارێک لە وانەیەکدا، کرتە لە خانەکەی بکە. مامۆستاکە ئاگادار دەکرێتەوە.</div></div>`}
   <div class="banner info" style="margin-top:8px">${ic('lock',20)}<div>تێبینییەکانی مامۆستا و نمرەکان لێرە نیشان نادرێن — تەنها دۆخی ئامادەبوون.</div></div>`;
  $('#bk').onclick=()=>{UI.acid=null;vCourses();};

async function adminEditMark(c,key,sid){const st=C().students.find(x=>x.id===sid);const date=key.slice(0,10);const a=S['att_'+c.id];const old=a&&a.s[key]?a.s[key].m[sid]:undefined;const lv=leaveFor(sid,key);
  const cur=effective(old,lv);const sl=slotOfKey(c.id,key);
  const v=await modal('گۆڕینی دۆخ: '+st.name,`<div class="muted">${esc(c.name)} — ${esc(prettyDate(date))}${sl?' · '+sl.start:''}</div><div style="margin:6px 0 4px">دۆخی ئێستا: <b>${STN[cur]}</b></div>
    ${lv?`<div class="banner info" style="display:block;margin:6px 0 0">ئەم خوێندکارە لەم ڕۆژەدا مۆڵەتی فەرمیی هەیە. بۆ هەڵوەشاندنەوەی، بچۆ بەشی «مۆڵەت».</div>`:''}`,
    [{label:'✓ ئامادە',cls:'ok',value:'P'},{label:'نەهاتوو',cls:'danger',value:'A'},{label:'دواکەوتوو',cls:'warn',value:'T'},{label:'🏛 مۆڵەتی بەش',cls:'vio',value:'L'},{label:'سڕینەوەی تۆمار',cls:'outline',value:'X'},{label:'داخستن',value:null}]);
  if(!v)return;const nv=v==='X'?null:v;if((old||null)===nv)return;
  applyWrite('m|'+c.id+'|'+key+'|'+sid,nv,Date.now());
  tIds(c).forEach(tid=>notify(tid,'گۆڕانکاری لە ئامادەبوون: '+st.name,`${c.name} — ${prettyDate(date)}${sl?' '+sl.start:''}\n${STN[effective(old,null)]} ← ${nv?STN[nv]:'تۆمار نەکراو'}\nلە لایەن: ${ME.name}`,'att'));
  toast('گۆڕدرا ✓ — مامۆستاکە ئاگادار کرایەوە','ok');syncNow();vCourseAtt();}

function alertCfg(c){const g=GR(c.id);return Object.assign({daysOn:true,days:3,pctOn:true,pct:10,minRec:2,weeks:termWeeks(termOf(c))||14},g.alert||{});}
function perWeek(c){return Math.max(1,slotsOfC(c).length);}
const FULL_AFTER_WEEKS=5;
function absInfo(c,keys){keys=keys||courseKeys(c,'dev');const cfg=alertCfg(c);const wk=weeksRecorded(keys);const byRec=wk>FULL_AFTER_WEEKS;
  const total=byRec?r2(keys.reduce((a,k)=>a+keyHours(k,c.id),0)):r2(cfg.weeks*weekHours(c));const out={};
  studentsOfC(c).forEach(s=>{let A=0,AH=0;keys.forEach(k=>{if(effective(devMark(ME.id,c.id,k,s.id),leaveFor(s.id,k))==='A'){A++;AH+=keyHours(k,c.id);}});
    const pct=total?r2(AH/total*100):0;const active=keys.length>0;const hitD=active&&cfg.daysOn&&A>=cfg.days;const hitP=active&&cfg.pctOn&&pct>=cfg.pct;out[s.id]={A,AH:r2(AH),pct,hitD,hitP,hit:hitD||hitP};});
  return {out,cfg,total,recs:keys.length,wk,byRec};}

function recStats(c){const keys=courseKeys(c,'dev');const studs=studentsOfC(c);const st={};
  studs.forEach(s=>{const k={P:0,A:0,T:0,E:0,L:0,N:0};keys.forEach(key=>{k[effective(devMark(ME.id,c.id,key,s.id),leaveFor(s.id,key))]++;});k.came=k.P+k.T;let ch=0,th=0;keys.forEach(key=>{const w=keyHours(key,c.id);th+=w;const e=effective(devMark(ME.id,c.id,key,s.id),leaveFor(s.id,key));if(e==='P'||e==='T')ch+=w;});k.pct=th?Math.round(ch/th*100):0;st[s.id]=k;});
  const avg=studs.length&&keys.length?Math.round(studs.reduce((a,s)=>a+st[s.id].pct,0)/studs.length):0;return{keys,studs,st,avg};}

const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();

function zipFiles(files,mime){
  const enc=new TextEncoder();const parts=[],central=[];let off=0;const d=new Date();
  const dt=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1))&0xFFFF,dd=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF;
  for(const f of files){
    const nm=enc.encode(f.name),data=enc.encode(f.data),crc=crc32(data);
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,dt,true);h.setUint16(12,dd,true);
    h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,nm.length,true);h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer),nm,data);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,dt,true);c.setUint16(14,dd,true);
    c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,nm.length,true);c.setUint16(30,0,true);c.setUint16(32,0,true);
    c.setUint16(34,0,true);c.setUint16(36,0,true);c.setUint32(38,0,true);c.setUint32(42,off,true);
    central.push(new Uint8Array(c.buffer),nm);off+=30+nm.length+data.length;
  }
  const cds=central.reduce((s,b)=>s+b.length,0);const e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(4,0,true);e.setUint16(6,0,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cds,true);e.setUint32(16,off,true);e.setUint16(20,0,true);
  return new Blob([...parts,...central,new Uint8Array(e.buffer)],{type:mime});
}

function attMatrix(sh,c,read,H){const a=S['att_'+c.id]||{s:{}};const studs=studentsOfC(c);
  const ks=courseKeys(c,read==='dev'?'dev':'shared');const SY={P:['✓',8],A:['ن',6],T:['د',9],E:['م',7],L:['ب',7],N:['',3]};const SYZ={N:15};
  ['ژ','ناوی خوێندکار',...ks.map(k=>k.slice(0,10)+'\n'+kDay(k)),'ئامادە','نەهاتوو','دواکەوتوو','مۆڵەت','هاتن لە کۆی','ڕێژەی هاتن %'].forEach((h,i)=>put(sh,H,i,h,i>=2&&i<2+ks.length&&(i%2)?17:1));rowHt(sh,H,36);
  studs.forEach((s,i)=>{const r=H+1+i,z=i%2===1;put(sh,r,0,i+1,z?15:3);put(sh,r,1,snm(s),z?16:2);const k={P:0,A:0,T:0,E:0};
    ks.forEach((key,j)=>{const m=read==='dev'?devMark(ME.id,c.id,key,s.id):sharedMark(c.id,key,s.id);let e=effective(m,leaveFor(s.id,key));put(sh,r,2+j,SY[e][0],e==='N'&&z?15:SY[e][1]);const nt=cellNote(c,key,s.id,read==='dev');if(nt)(sh.comments||(sh.comments=[])).push({r,c:2+j,t:s.name+' — '+key.slice(0,10)+'\n'+nt});if(e==='L')e='E';if(k[e]!==undefined)k[e]++;});
    const b=2+ks.length;put(sh,r,b,k.P,10);put(sh,r,b+1,k.A,6);put(sh,r,b+2,k.T,9);put(sh,r,b+3,k.E,7);const came=k.P+k.T;put(sh,r,b+4,came+' لە '+ks.length,18);put(sh,r,b+5,ks.length?r2(came/ks.length*100):'',19);});
  sh.cols=[6,30,...ks.map(()=>11),9,9,10,9,12,12];sh.freeze={row:H+1,col:2};}
function head3(sh,n,title,c){const L=colL(n-1);put(sh,0,0,title,4);sh.merges.push(`A1:${L}1`);rowHt(sh,0,30);put(sh,1,0,[C().univ,C().dept].filter(Boolean).join(' — '),5);sh.merges.push(`A2:${L}2`);
  put(sh,2,0,`وانە: ${c.name}   ●   ${gLabel(c.stage)}   ●   مامۆستا: ${tNames(c)}   ●   ${todayISO()}`,5);sh.merges.push(`A3:${L}3`);}

function buildBook(sheets){const files=[
   {name:'[Content_Types].xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>${sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`},

   {name:'xl/workbook.xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><bookViews><workbookView/></bookViews><sheets>${sheets.map((s,i)=>`<sheet name="${xe(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets><calcPr calcId="191029" fullCalcOnLoad="1"/></workbook>`},
   {name:'xl/_rels/workbook.xml.rels',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`},
   {name:'xl/styles.xml',data:XSTYLES},...sheets.map((s,i)=>({name:`xl/worksheets/sheet${i+1}.xml`,data:sheetXml(s)})),...sheets.flatMap((s,i)=>commentFiles(s,i+1))];
  const anyC=sheets.some(s=>s.comments&&s.comments.length);
  if(anyC)files[0].data=files[0].data.replace('<Default Extension="xml"','<Default Extension="vml" ContentType="application/vnd.openxmlformats-officedocument.vmlDrawing"/><Default Extension="xml"').replace('</Types>',sheets.map((s,i)=>s.comments&&s.comments.length?`<Override PartName="/xl/comments${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.comments+xml"/>`:'').join('')+'</Types>');
  return zipFiles(files,'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');}
function exportAttXlsx(c,read){const sh=mkSheet('ئامادەبوون');head3(sh,8,'تۆماری ئامادەبوونی خوێندکاران',c);attMatrix(sh,c,read,4);const b=buildBook([sh]);window.__lastXlsx=b;fileSheet({title:'ئێکسڵی ئامادەبوون — '+c.name,fname:safeName(c.name)+' - ئامادەبوون - '+todayISO(),xlsx:b});}
function exportTeacherXlsx(c){const g=GR(c.id);const studs=studentsOfC(c);const mx=r2(VC(g).reduce((a,k)=>a+(+k.max||0),0));const GL=gLayout(g);
  const nA=GL.acts.length,hasA=nA>0,nT=GL.tail.length;const cA=2+nA+(hasA?1:0);   // first column after «کۆی چالاکی»
  const s1=mkSheet('نمرەکان');const n=cA+nT+3;head3(s1,n,'لیستی نمرەکان',c);
  ['ژ','ناوی خوێندکار',...GL.acts.map(k=>k.name+'\n('+fmt(k.max)+')'),...(hasA?['کۆی چالاکی\n('+GL.actMax+')']:[]),...GL.tail.map(k=>k.name+'\n('+fmt(k.max)+')'),'ئەنجام\n('+mx+')','ڕێژە %','هەڵسەنگاندن'].forEach((h,i)=>put(s1,4,i,h,i>=2&&i<cA+nT&&(i%2)?17:1));rowHt(s1,4,40);
  studs.forEach((s,i)=>{const r=5+i,R=r+1,z=i%2===1;put(s1,r,0,i+1,z?15:3);put(s1,r,1,snm(s),z?16:2);let sum=0,any=false,as=0,aany=false;
    GL.acts.forEach((k,j)=>{const v=gradeVal(c,s.id,k);if(v!==undefined&&v!==null){sum+=+v;any=true;as+=+v;aany=true;}put(s1,r,2+j,v??'',z?15:3);});
    if(hasA){const a1=colL(2),a2=colL(1+nA);put(s1,r,2+nA,aany?r2(as):'',18,`IF(COUNT(${a1}${R}:${a2}${R})=0,"",SUM(${a1}${R}:${a2}${R}))`);}
    GL.tail.forEach((k,j)=>{const v=gradeVal(c,s.id,k);if(v!==undefined&&v!==null){sum+=+v;any=true;}put(s1,r,cA+j,v??'',z?15:3);});
    const parts=[...(hasA?[colL(2+nA)+R]:[]),...GL.tail.map((k,j)=>colL(cA+j)+R)];const T=colL(cA+nT),PC=colL(cA+nT+1);
    if(parts.length)put(s1,r,cA+nT,any?r2(sum):'',18,`IF(COUNT(${parts.join(',')})=0,"",SUM(${parts.join(',')}))`);
    const pc=any&&mx?r2(sum/mx*100):'';put(s1,r,cA+nT+1,pc,19,mx?`IF(${T}${R}="","",ROUND(${T}${R}/${mx}*100,1))`:null);
    put(s1,r,cA+nT+2,pc===''?'':(pc>=50?'دەرچوو':'دەرنەچوو'),pc===''?(z?15:3):(pc>=50?20:21),`IF(${PC}${R}="","",IF(${PC}${R}>=50,"دەرچوو","دەرنەچوو"))`);});

const PFONT='"Noto Sans Arabic", Tahoma, sans-serif';
async function ensureFonts(){try{await Promise.all([document.fonts.load('400 22px "Noto Sans Arabic"'),document.fonts.load('700 22px "Noto Sans Arabic"')]);}catch(e){}}
function newPage(land){const W=land?2339:1654,H=land?1654:2339;const cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);x.textBaseline='middle';return{cv,x,W,H,land};}
function PT(x,txt,px,py,o={}){let size=o.size||22;const weight=o.weight||400;x.font=`${weight} ${size}px ${PFONT}`;if(o.fit&&o.maxW){while(size>13&&x.measureText(String(txt??'')).width>o.maxW){size--;x.font=`${weight} ${size}px ${PFONT}`;}}x.fillStyle=o.color||'#14213a';x.textAlign=o.align||'right';x.direction=o.dir||'rtl';
  let s=String(txt??'');if(o.maxW&&x.measureText(s).width>o.maxW){while(s.length>1&&x.measureText(s+'…').width>o.maxW)s=s.slice(0,-1);s+='…';}x.fillText(s,px,py);return x.measureText(s).width;}
function picon(x,k,cx,cy,r){r=r||13;x.save();x.lineCap='round';x.lineJoin='round';const bg=(c)=>{x.fillStyle=c;x.beginPath();x.arc(cx,cy,r+5,0,Math.PI*2);x.fill();};
  if(k==='P'){bg('#dcfce7');x.strokeStyle='#15803d';x.lineWidth=4.5;x.beginPath();x.moveTo(cx-r*.55,cy+r*.02);x.lineTo(cx-r*.12,cy+r*.45);x.lineTo(cx+r*.6,cy-r*.5);x.stroke();}
  else if(k==='A'){bg('#fee2e2');x.strokeStyle='#dc2626';x.lineWidth=4.5;x.beginPath();x.moveTo(cx-r*.45,cy-r*.45);x.lineTo(cx+r*.45,cy+r*.45);x.moveTo(cx+r*.45,cy-r*.45);x.lineTo(cx-r*.45,cy+r*.45);x.stroke();}
  else if(k==='T'){bg('#fef3c7');x.strokeStyle='#b45309';x.lineWidth=3;x.beginPath();x.arc(cx,cy,r*.72,0,Math.PI*2);x.stroke();x.beginPath();x.moveTo(cx,cy);x.lineTo(cx,cy-r*.45);x.moveTo(cx,cy);x.lineTo(cx+r*.38,cy+r*.12);x.stroke();}
  else if(k==='E'||k==='L'){const c=k==='L'?'#6d28d9':'#1d4ed8';bg(k==='L'?'#ede9fe':'#dbeafe');const w=r*1.05,h=r*1.35,l=cx-w/2,t=cy-h/2,f=r*.35;
    x.strokeStyle=c;x.lineWidth=2.6;x.beginPath();x.moveTo(l,t);x.lineTo(l+w-f,t);x.lineTo(l+w,t+f);x.lineTo(l+w,t+h);x.lineTo(l,t+h);x.closePath();x.stroke();
    x.lineWidth=2.4;x.beginPath();if(k==='L'){x.moveTo(cx,cy-r*.32);x.lineTo(cx,cy+r*.32);x.moveTo(cx-r*.32,cy);x.lineTo(cx+r*.32,cy);}else{x.moveTo(cx-r*.3,cy-r*.15);x.lineTo(cx+r*.3,cy-r*.15);x.moveTo(cx-r*.3,cy+r*.2);x.lineTo(cx+r*.2,cy+r*.2);}x.stroke();}
  else{x.fillStyle='#cbd5e1';x.beginPath();x.arc(cx,cy,3.5,0,Math.PI*2);x.fill();}
  x.restore();}
function pageFrame(pg,o,pi,pn){const{x,W,H}=pg;const R=W-70,L=70;
  x.fillStyle='#1d4e89';x.fillRect(0,0,W,14);
  PT(x,[C().univ,C().dept].filter(Boolean).join(' — '),R,62,{size:27,weight:700,color:'#1d4e89'});
  PT(x,'بەرواری چاپ: '+todayISO(),L,62,{size:20,color:'#64748b',align:'left'});
  PT(x,o.title,W/2,128,{size:40,weight:700,align:'center'});
  (o.lines||[]).forEach((ln,i)=>PT(x,ln,W/2,180+i*36,{size:24,color:'#334155',align:'center'}));
  let y=180+(o.lines||[]).length*36;
  if(o.legend){let cx=R;y+=6;o.legend.forEach(([k,label])=>{picon(x,k,cx-14,y,12);const w=PT(x,label,cx-38,y+1,{size:21,color:'#334155'});cx-=w+78;});y+=34;}

/* ================= Keyboard: keep the focused field visible ================= */
(function(){
  const touch=window.matchMedia&&matchMedia('(pointer:coarse)').matches;if(!touch)return;
  const vv=window.visualViewport;const B=document.body;
  const isField=el=>el&&(el.tagName==='TEXTAREA'||(el.tagName==='INPUT'&&!['checkbox','radio','button','file','date','time','range'].includes(el.type)));
  let base=innerHeight,baseW=innerWidth,kbOpen=false,hideT=null;
  const covered=()=>vv?Math.max(0,innerHeight-vv.height-vv.offsetTop):0; // part of the page hidden under the keyboard
  function setKb(on){
    if(on){B.style.setProperty('--kbh',(covered()+24)+'px');if(!kbOpen){kbOpen=true;B.classList.add('kb');}}
    else if(kbOpen){kbOpen=false;B.classList.remove('kb');B.style.removeProperty('--kbh');}
    window.__kbAt=Date.now();
  }
  /* bring the field into view with the smallest possible move (no big jumps) */
  function reveal(el){
    if(!el||document.activeElement!==el)return;
    const dlg=el.closest('.dlg');
    if(dlg){const r=el.getBoundingClientRect(),d=dlg.getBoundingClientRect();if(r.top<d.top+40||r.bottom>d.bottom-70)dlg.scrollTop+=r.top-d.top-60;return;}
    const box=el.closest('.tbl-wrap');
    if(box){const r=el.getBoundingClientRect(),b=box.getBoundingClientRect();
      if(r.left<b.left||r.right>b.right)box.scrollLeft+=(r.left+r.width/2)-(b.left+b.width/2);
      const th=box.querySelector('thead');const hh=th?th.getBoundingClientRect().height:0;
      if(r.top<b.top+hh+4)box.scrollTop-=(b.top+hh+8-r.top);else if(r.bottom>b.bottom-4)box.scrollTop+=(r.bottom-b.bottom+8);}
    const top=(vv?vv.offsetTop:0)+12,bot=(vv?vv.offsetTop+vv.height:innerHeight)-16;
    const r=el.getBoundingClientRect();
    if(r.top<top)window.scrollBy(0,r.top-top-8);else if(r.bottom>bot)window.scrollBy(0,r.bottom-bot+8);
  }
  if(vv){
    const check=()=>{
      if(innerWidth!==baseW){baseW=innerWidth;base=innerHeight;} // rotated
      if(!kbOpen&&vv.height>base)base=vv.height;
      const open=base-vv.height>140;
      const el=document.activeElement;
      if(open&&isField(el)){setKb(true);requestAnimationFrame(()=>reveal(el));}
      else if(!open&&kbOpen){setKb(false);if(isField(el))el.blur();} // keyboard closed with the back/down key: drop the focus and the extra space
    };
    vv.addEventListener('resize',check);
  }
  document.addEventListener('focusin',e=>{const el=e.target;if(!isField(el))return;clearTimeout(hideT);
    if(!vv){setTimeout(()=>{if(document.activeElement===el){B.style.setProperty('--kbh','50vh');B.classList.add('kb');kbOpen=true;}},260);}
    else if(kbOpen)setKb(true);
    setTimeout(()=>reveal(el),350);});
  document.addEventListener('focusout',e=>{if(!isField(e.target))return;hideT=setTimeout(()=>{if(!isField(document.activeElement)&&(!vv||base-vv.height<=140))setKb(false);},300);});
})();

function padModal(){let editing=null;
  const draw=ov=>{const list=myPad();const box=$('#padBox',ov);
    box.innerHTML=`<div class="padin"><textarea class="inp" id="padT" rows="3" placeholder="تێبینییەکی نوێ بنووسە...">${editing?esc(editing.t):''}</textarea>
      <div class="row" style="margin-top:8px">${editing?'<button class="btn sm" id="padX">پاشگەزبوونەوە</button>':''}<button class="btn sm pri" id="padS" style="margin-inline-start:auto">${editing?'نوێکردنەوە':'پاشەکەوت'}</button></div></div>
      ${list.length?`<div class="padl">${list.map(x=>`<div class="padi ${editing&&editing.id===x.id?'ed':''}" data-id="${x.id}"><div class="padtx">${esc(x.t)}</div><div class="padft"><span>${esc(prettyDate(new Date(x.up||x.at).toISOString().slice(0,10)))} · ${new Date(x.up||x.at).toTimeString().slice(0,5)}${x.up?' · دەستکاری کراو':''}</span><span class="sp"><button class="ibtn" data-a="e">${IC.edit}</button><button class="ibtn red" data-a="d">${IC.del}</button></span></div></div>`).join('')}</div>`:'<div class="empty" style="padding:22px 0">هێشتا هیچ تێبینییەکت نییە.</div>'}`;
    $('#padS',ov).onclick=()=>{const t=$('#padT',ov).value.trim();if(!t){toast('شتێک بنووسە','err');return;}
      if(editing){const x=list.find(y=>y.id===editing.id);if(x){x.t=t;x.up=Date.now();}editing=null;}else list.unshift({id:rid(),t,at:Date.now()});
      touch('notes_'+ME.id);toast('پاشەکەوت کرا ✓','ok');draw(ov);updPad();};
    if($('#padX',ov))$('#padX',ov).onclick=()=>{editing=null;draw(ov);};
    $$('.padi',ov).forEach(r=>r.onclick=async e=>{const b=e.target.closest('button');if(!b)return;const x=list.find(y=>y.id===r.dataset.id);if(!x)return;
      if(b.dataset.a==='e'){editing={id:x.id,t:x.t};draw(ov);const ta=$('#padT',ov);ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);}
      else if(b.dataset.a==='d'){if(!await confirmBox('ئەم تێبینییە بسڕدرێتەوە؟','سڕینەوە'))return;list.splice(list.indexOf(x),1);touch('notes_'+ME.id);draw(ov);updPad();}});};
  modal('📝 تێبینییەکانم',`<div class="priv" style="margin:0 0 10px">${ic('lock',14)} تەنها تۆ دەیبینیت. ئیدارە و سەرۆکی بەش نایبینن. لەگەڵ داتاکانی تر پاشەکەوت و باکئەپ دەکرێت.</div><div id="padBox"></div>`,[{label:'داخستن',cls:'pri',value:true}],ov=>draw(ov));}
function updPad(){const b=$('#padBtn');if(!b)return;const n=padCount();let c=b.querySelector('.cnt');if(n){if(!c){c=document.createElement('span');c.className='cnt pc';b.appendChild(c);}c.textContent=n;}else if(c)c.remove();}
/* ================= Phone back button: first back → home tab, second back → close ================= */
const HOME=()=>isAdmin()?'dash':'today';
function armBack(){try{if(!history.state||!history.state.uosArm)history.pushState({uosArm:1},'');}catch(e){}}
window.addEventListener('popstate',()=>{
  if(!ME)return;
  const ov=document.querySelector('.ov');
  if(ov&&ov.__close){ov.__close(null);armBack();return;}
  const fs=document.querySelector('.fsheet');if(fs){const x=fs.querySelector('[data-close],.fclose,#fsClose');if(x)x.click();else fs.remove();armBack();return;}
  if(UI.tab!==HOME()||UI.open||UI.acid||UI.arv){UI.tab=HOME();UI.open=null;UI.acid=null;UI.arv=null;goTodayDate();render();scrollTo(0,0);armBack();return;}
  try{history.back();}catch(e){}
});
/* ================= Boot ================= */
(async function boot(){
  await loadCache();
  const ld=$('#loading');if(ld)ld.remove();
  if(TOKEN&&MYID&&S.core){ME=user(MYID)||null;if(ME&&ME.active===false)ME=null;}
  if(ME){render();syncNow();}
  else if(TOKEN&&MYID)startSession(TOKEN,MYID);
  else renderLogin();
  setInterval(()=>{if(document.visibilityState==='visible'&&ME)syncNow();},60000);
  window.addEventListener('online',()=>{if(ME)syncNow();});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(ME)syncNow();}else persist();});
  window.addEventListener('pagehide',()=>persist());
})();
</script>
</body>
